<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlusUltra iOS Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/cv/js/cast_sender.js"></script>
    <script>
    window.castAvailable = false;
    window['__onGCastApiAvailable'] = function(isAvailable) {
      if (isAvailable && window.cast && window.chrome) {
        window.castAvailable = true;
        const btn = document.getElementById("castBtn");
        if (btn) btn.style.display = "inline-block";
      }
    };
    </script>

    <style>
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;background:linear-gradient(to bottom,#1c1c1e,#2c2c2e);color:white;padding-top:90px;overflow-x:hidden;}
        .header{position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;z-index:9999;background:rgba(28,28,30,.35);backdrop-filter:blur(25px);transition:.3s;border-bottom:1px solid rgba(255,255,255,.1);box-sizing:border-box;}
        .header.scrolled{background:rgba(28,28,30,.9);box-shadow:0 10px 30px rgba(0,0,0,.5);}
        .logo{font-size:34px;font-weight:700;color:#0a84ff;}
        .header-right{display:flex;align-items:center;gap:12px;}
        .search{padding:10px 18px;border-radius:24px;border:none;width:260px;font-size:16px;background:rgba(255,255,255,.1);color:white;outline:none;}
        .logout{white-space:nowrap;padding:10px 14px;border:none;border-radius:12px;background:#ff3b30;color:#fff;cursor:pointer;font-weight:bold;}
        .row{margin-top:40px;padding-left:20px;padding-bottom:10px;}
        .row h2{font-size:22px;margin-bottom:14px;color:rgba(255,255,255,0.9);}
        .carousel{display:flex;gap:18px;overflow-x:auto;padding:10px 20px 20px 0;scroll-behavior:smooth;}
        .carousel::-webkit-scrollbar{height:6px;}
        .carousel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:10px;}
        .card{width:200px;flex-shrink:0;aspect-ratio:2/3;position:relative;border-radius:18px;overflow:hidden;cursor:pointer;transition:transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);}
        .card:hover{transform:scale(1.05);z-index:10;}
        .card img{width:100%;height:100%;object-fit:cover;}
        .player,.series-modal{position:fixed;inset:0;display:none;justify-content:center;align-items:center;z-index:999999;}
        .player{background:rgba(0,0,0,.98);}
        .series-modal{background:rgba(28,28,30,.98);backdrop-filter:blur(20px);}
        .player-inner,.series-inner{width:90vw;height:85vh;background:#1c1c1e;border-radius:24px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;padding:20px;}
        video{width:100%;height:100%;border-radius:12px;background:#000;}
        .close{position:absolute;top:20px;right:25px;font-size:28px;cursor:pointer;color:white;z-index:100;background:rgba(0,0,0,0.5);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
        .player-nav{position:absolute;top:20px;left:25px;z-index:100;display:flex;gap:10px;}
        .player-nav button, .episode-list button, .continue-btn{padding:10px 16px;border:none;border-radius:12px;background:#0a84ff;color:#fff;cursor:pointer;font-weight:600;}
        .episode-list{width:100%;display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;overflow-y:auto;padding-bottom:40px;}
        #loginModal{position:fixed;inset:0;background:#000;display:flex;justify-content:center;align-items:center;z-index:9999999;}
        #loginBox{background:#1c1c1e;padding:40px;border-radius:28px;display:flex;flex-direction:column;gap:18px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,0.5);}
        #loginBox h2{margin:0 0 10px 0;text-align:center;}
        #loginBox input{padding:14px;border-radius:12px;border:1px solid #3a3a3c;background:#2c2c2e;color:white;font-size:16px;}
        #loginBox button{padding:14px;border:none;border-radius:12px;background:#0a84ff;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;}
        #loginError{display:none;color:#ff453a;font-size:14px;text-align:center;margin:0;}
        .continue-card{position:relative;}
        .continue-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:15px;gap:8px;}
        .continue-info{font-size:12px;font-weight:600;color:#0a84ff;}
        .continue-line{height:4px;border-radius:2px;background:rgba(255,255,255,0.2);position:relative;overflow:hidden;}
        .continue-progress{height:100%;background:#0a84ff;width:0%;}
        .season-select{display:flex;gap:10px;margin-top:15px;overflow-x:auto;width:100%;padding-bottom:10px;}
        .season-option {padding:10px 18px;background:rgba(255,255,255,.1);border-radius:12px;cursor:pointer;white-space:nowrap;font-weight:500;}
        .season-option.active {background:#0a84ff;color:white;}
        .episode-indicator{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(10,132,255,0.9);padding:8px 20px;border-radius:20px;font-size:14px;font-weight:bold;opacity:0;transition:0.4s;z-index:100;}
        .episode-indicator.show{opacity:1;}
    </style>
</head>

<body>

<div id="loginModal">
    <div id="loginBox">
        <div class="logo" style="text-align:center; margin-bottom:10px;">PlusUltra</div>
        <h2>Bienvenido</h2>
        <input id="loginUser" type="email" placeholder="Correo electrónico">
        <input id="loginPass" type="password" placeholder="Contraseña">
        <button id="loginBtn">Entrar</button>
        <p id="loginError"></p>
    </div>
</div>

<div class="header">
    <div class="logo">PlusUltra</div>
    <div class="header-right">
        <input id="search" class="search" placeholder="Películas, series...">
        <button class="logout" onclick="logout()">Salir</button>
    </div>
</div>

<div id="app"></div>

<div class="player" id="player">
    <div class="player-inner">
        <span class="close" onclick="closeVideo()">✕</span>
        <div class="player-nav" id="playerNav">
            <button onclick="prevEpisode()">⏮ Anterior</button>
            <button onclick="nextEpisode()">Siguiente ⏭</button>
            <button id="castBtn" onclick="castVideo()" style="display:none;">📺 Cast</button>
        </div>
        <div id="episodeIndicator" class="episode-indicator"></div>
        <video id="video" controls controlsList="nodownload"></video>
    </div>
</div>

<div class="series-modal" id="seriesModal">
    <div class="series-inner">
        <span class="close" onclick="closeSeriesModal()">✕</span>
        <h2 id="seriesTitle" style="margin-top:0; font-size:28px;"></h2>
        <div id="seasonSelect" class="season-select"></div>
        <div class="episode-list" id="episodeList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
    authDomain: "midata-40f73.firebaseapp.com",
    projectId: "midata-40f73",
    storageBucket: "midata-40f73.firebasestorage.app",
    messagingSenderId: "104287406146",
    appId: "1:104287406146:web:d9fad446e22629559dc5db"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
localStorage.setItem("sessionId", sessionId);

let allVideos = [];
let currentSeries = null;
let currentSeason = 0;
let currentEpisode = 0;
let sessionInterval = null;

// Normalizador de texto para filtros (ignora acentos y mayúsculas)
const cleanText = (t) => t ? t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";

async function registerSession(user) {
    try {
        const ref = doc(db, "users", user.uid);
        const snap = await getDoc(ref);
        let sessions = snap.exists() ? snap.data().sessions || [] : [];
        const now = Date.now();
        sessions = sessions.filter(s => s.id !== sessionId);
        sessions.push({ id: sessionId, lastSeen: now });
        sessions.sort((a, b) => a.lastSeen - b.lastSeen);
        if (sessions.length > 2) sessions = sessions.slice(-2);
        await setDoc(ref, { sessions }, { merge: true });
    } catch (e) { console.error("Error de sesión:", e); }
}

async function validateSession(user) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) return true; // Si no hay registro, permitir
    const sessions = snap.data().sessions || [];
    return sessions.some(s => s.id === sessionId);
}

function startSessionWatcher(user) {
    if(sessionInterval) clearInterval(sessionInterval);
    sessionInterval = setInterval(async () => {
        const valid = await validateSession(user);
        if (!valid) {
            clearInterval(sessionInterval);
            alert("Tu cuenta se abrió en otro dispositivo");
            await signOut(auth);
            location.reload();
        }
    }, 15000);
}

window.addEventListener("scroll",()=>{
    document.querySelector(".header").classList.toggle("scrolled",window.scrollY>20);
});

const STORAGE_KEY="plus_ultra_prog";
function getProgress(){ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"); }

function saveProgress(id,time,duration){
    const data=getProgress();
    data[id]={ time, duration, updated:Date.now(), season:currentSeries ? currentSeason : null, episode:currentSeries ? currentEpisode : null };
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

const playerController = {
    video:null, hls:null, currentId:null,
    init(){
        this.video = document.getElementById("video");
        let lastSave = 0;
        this.video.addEventListener("timeupdate", () => {
            const now = Date.now();
            if(this.currentId && now - lastSave > 5000){
                saveProgress(this.currentId, this.video.currentTime, this.video.duration);
                lastSave = now;
            }
        });
        this.video.addEventListener("ended", () => {
            if(currentSeries) nextEpisode();
            else closeVideo();
        });
    },
    play(v){
        this.cleanup();
        this.currentId = currentSeries ? `${currentSeries.titulo}-S${currentSeason}-E${currentEpisode}` : v.titulo;
        const progress = getProgress()[this.currentId];

        if(v.url.includes(".m3u8") && Hls.isSupported()){
            this.hls = new Hls();
            this.hls.loadSource(v.url);
            this.hls.attachMedia(this.video);
            this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if(progress?.time) this.video.currentTime = progress.time;
                this.video.play();
                showEpisodeIndicator();
            });
        } else {
            this.video.src = v.url;
            this.video.onloadedmetadata = () => {
                if(progress?.time) this.video.currentTime = progress.time;
                this.video.play();
                showEpisodeIndicator();
            };
        }
    },
    cleanup(){
        if(this.hls){ this.hls.destroy(); this.hls = null; }
        this.video.pause();
        this.video.removeAttribute("src");
        this.video.load();
        this.currentId = null;
    }
};

window.openVideo = function(v){
    document.getElementById("player").style.display="flex";
    document.getElementById("playerNav").style.display= currentSeries ? "flex" : "none";
    playerController.play(v);
}

function showEpisodeIndicator(){
    if(!currentSeries) return;
    const el = document.getElementById("episodeIndicator");
    el.innerText = `Temporada ${currentSeason+1} • Episodio ${currentEpisode+1}`;
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"),3500);
}

window.closeVideo=function(){
    playerController.cleanup();
    document.getElementById("player").style.display="none";
};

window.openSeriesModal = function(series){
    currentSeries=series;
    document.getElementById("seriesModal").style.display="flex";
    document.getElementById("seriesTitle").innerText=series.titulo;

    fetch(series.temporadasUrl).then(r=>r.json()).then(data=>{
        currentSeries.temporadas=data;
        const seasonBox = document.getElementById("seasonSelect");
        seasonBox.innerHTML = "";
        data.forEach((t, i) => {
            const btn = document.createElement("div");
            btn.className = "season-option " + (i === currentSeason ? "active" : "");
            btn.innerText = "Temporada " + t.numero;
            btn.onclick = () => {
                currentSeason = i;
                document.querySelectorAll(".season-option").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderEpisodes(i);
            };
            seasonBox.appendChild(btn);
        });
        renderEpisodes(currentSeason);
    });
}

window.closeSeriesModal=function(reset=true){
    document.getElementById("seriesModal").style.display="none";
    if(reset){ currentSeries=null; currentSeason=0; currentEpisode=0; }
};

function renderEpisodes(index){
    const list=document.getElementById("episodeList");
    list.innerHTML="";
    currentSeries.temporadas[index].episodios.forEach((ep,i)=>{
        const btn=document.createElement("button");
        btn.innerText=`E${i+1}: ${ep.titulo}`;
        btn.onclick=()=>{ currentEpisode=i; openVideo(ep); };
        list.appendChild(btn);
    });
}

window.nextEpisode=function(){
    if(!currentSeries) return;
    const season=currentSeries.temporadas[currentSeason];
    if(currentEpisode < season.episodios.length-1){
        currentEpisode++;
        openVideo(season.episodios[currentEpisode]);
    } else if(currentSeason < currentSeries.temporadas.length-1){
        currentSeason++; currentEpisode=0;
        openVideo(currentSeries.temporadas[currentSeason].episodios[0]);
    } else { closeVideo(); }
};

window.prevEpisode=function(){
    if(!currentSeries || currentEpisode <= 0) return;
    currentEpisode--;
    openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]);
};

function buildUI(){
    document.getElementById("app").innerHTML=`
    <div class="row"><h2>🆕 Recientes</h2><div class="carousel" id="recentRow"></div></div>
    <div class="row" id="rowContinue" style="display:none;"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
    <div class="row"><h2>🍿 Cine</h2><div class="carousel" id="cineRow"></div></div>
    <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
    <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
    <div class="row"><h2>🍥 Anime</h2><div class="carousel" id="animeRow"></div></div>`;
    renderAll();
}

function renderAll(){
    // Aplicamos limpieza de texto para que coincida con el JSON del worker
    const render = (tipo, id) => renderRow(allVideos.filter(v => cleanText(v.tipo) === tipo), id);
    
    render("pelicula","peliculasRow"); 
    render("serie","seriesRow"); 
    render("anime","animeRow"); 
    render("cine","cineRow");
    
    renderRow([...allVideos].reverse().slice(0,15),"recentRow");
    renderContinue();
}

function createCard(v) {
    const card = document.createElement("div");
    card.className = "card"; 
    card.innerHTML = `<img src="${v.img}" loading="lazy" alt="${v.titulo}">`;
    card.onclick = () => { 
        if(cleanText(v.tipo) === "serie" || cleanText(v.tipo) === "anime") {
            openSeriesModal(v);
        } else {
            currentSeries = null;
            openVideo(v);
        }
    };
    return card;
}

function renderRow(list, id) {
    const row = document.getElementById(id);
    if (!row) return;
    row.innerHTML = "";
    list.forEach(v => row.appendChild(createCard(v)));
    row.dataset.fullList = JSON.stringify(list);
}

function renderContinue(){
    const data = getProgress();
    const row = document.getElementById("continueRow");
    const container = document.getElementById("rowContinue");
    row.innerHTML = "";
    
    const items = Object.keys(data)
    .map(id => {
        const isSerie = id.includes("-S");
        const title = isSerie ? id.split("-S")[0] : id;
        const base = allVideos.find(v => v.titulo === title);
        return base ? { ...base, _progressId: id, _prog: data[id] } : null;
    })
    .filter(v => v && v._prog.time < v._prog.duration * 0.95)
    .sort((a,b) => b._prog.updated - a._prog.updated)
    .slice(0,8);

    if(items.length > 0) {
        container.style.display = "block";
        items.forEach(v => {
            const p = v._prog;
            const pct = (p.time / p.duration) * 100;
            const card = document.createElement("div");
            card.className = "card continue-card";
            card.innerHTML = `
                <img src="${v.img}" loading="lazy">
                <div class="continue-overlay">
                    <div class="continue-info">${v.titulo}</div>
                    <div class="continue-line"><div class="continue-progress" style="width:${pct}%"></div></div>
                </div>`;
            card.onclick = () => {
                if(cleanText(v.tipo)==="serie" || cleanText(v.tipo)==="anime") {
                    currentSeries = v; currentSeason = p.season || 0; currentEpisode = p.episode || 0;
                    fetch(v.temporadasUrl).then(r=>r.json()).then(d=>{ 
                        currentSeries.temporadas=d; 
                        openVideo(d[currentSeason].episodios[currentEpisode]); 
                    });
                } else {
                    currentSeries = null; openVideo(v);
                }
            };
            row.appendChild(card);
        });
    } else { container.style.display = "none"; }
}

document.getElementById("search").addEventListener("input", (e) => {
    const txt = cleanText(e.target.value);
    const sections = ["peliculasRow", "seriesRow", "animeRow", "cineRow", "recentRow"];

    sections.forEach(rowId => {
        const row = document.getElementById(rowId);
        if (!row || !row.dataset.fullList) return;
        const fullList = JSON.parse(row.dataset.fullList);
        
        if (txt === "") {
            renderRow(fullList, rowId);
        } else {
            const filtered = fullList.filter(v => cleanText(v.titulo).includes(txt));
            row.innerHTML = "";
            filtered.forEach(v => row.appendChild(createCard(v)));
        }
    });
});

document.getElementById("loginBtn").onclick=async()=>{
    const email=document.getElementById("loginUser").value.trim();
    const pass=document.getElementById("loginPass").value.trim();
    const errEl = document.getElementById("loginError");
    try{ 
        errEl.style.display="none";
        await signInWithEmailAndPassword(auth,email,pass); 
    } catch(e){ 
        errEl.innerText = "Correo o contraseña incorrectos"; 
        errEl.style.display="block"; 
    }
};

onAuthStateChanged(auth, async (user)=>{
    if(user){
        document.getElementById("loginModal").style.display="none";
        await registerSession(user);
        startSessionWatcher(user);
        playerController.init();
        
        console.log("Cargando catálogo desde el Worker...");
        fetch("https://small-king-30c8.rigobertin100.workers.dev")
            .then(r => r.json())
            .then(data => { 
                console.log("Catálogo cargado con éxito. Items:", data.length);
                allVideos = Array.isArray(data) ? data : []; 
                buildUI(); 
            })
            .catch(err => {
                console.error("Error cargando el catálogo:", err);
                alert("Error al conectar con el servidor de videos.");
            });
    }else{
        document.getElementById("loginModal").style.display="flex";
        if(sessionInterval) clearInterval(sessionInterval);
    }
});

window.logout=async function(){ await signOut(auth); };

// CHROMECAST
let castContext = null;
window.castVideo = function () {
    if (!window.castAvailable) { alert("Chromecast no disponible"); return; }
    castContext = cast.framework.CastContext.getInstance();
    castContext.setOptions({ receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID, autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
    
    castContext.requestSession().then(() => {
        const session = castContext.getCurrentSession();
        const mediaInfo = new chrome.cast.media.MediaInfo(document.getElementById("video").src, "video/mp4");
        session.loadMedia(new chrome.cast.media.LoadRequest(mediaInfo));
    }).catch(err => console.log(err));
};
</script>
</body>
</html>
