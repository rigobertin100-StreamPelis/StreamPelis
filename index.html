<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusUltra Universal</title>

    <!-- Estética Apple/iOS que prefieres -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #000; --panel: #121212; --accent: #0a84ff; --card: #1c1c1e; --text-sec: #8e8e93; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar mejorado */
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid #2c2c2e; display: flex; flex-direction: column; padding: 25px; z-index: 100; }
        .logo { font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 35px; letter-spacing: -1px; }
        
        .search-container { margin-bottom: 30px; }
        .search-input { width: 100%; background: #2c2c2e; border: none; border-radius: 12px; padding: 12px 15px; color: white; font-size: 15px; outline: none; }

        .nav-group { flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 12px; cursor: pointer; color: var(--text-sec); transition: 0.3s; margin-bottom: 8px; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: #2c2c2e; color: white; }

        .main-content { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
        .row { margin-bottom: 45px; }
        .row h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #fff; }
        
        .carousel { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }

        .card { width: 190px; flex-shrink: 0; cursor: pointer; transition: 0.4s cubic-bezier(0.2, 1, 0.2, 1); }
        .card:hover { transform: scale(1.05); }
        .card-inner { position: relative; aspect-ratio: 2/3; border-radius: 18px; overflow: hidden; background: var(--card); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(45deg, #1c1c1e, #2c2c2e); padding: 20px; text-align: center; font-size: 13px; color: var(--text-sec); }
        .card-title { margin-top: 12px; font-size: 15px; font-weight: 500; text-align: center; color: #efeff4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        .close-btn { position: absolute; top: 30px; right: 30px; font-size: 35px; cursor: pointer; z-index: 2100; color: white; opacity: 0.7; }
        video { width: 100%; height: 100%; }

        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="loader">
    <div style="width: 45px; height: 45px; border: 4px solid #2c2c2e; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;"></div>
</div>

<aside class="sidebar">
    <div class="logo">PlusUltra</div>
    <div class="search-container">
        <input type="text" id="searchBox" class="search-input" placeholder="Buscar...">
    </div>
    <div class="nav-group">
        <div class="nav-item active">🆕 Novedades</div>
        <div class="nav-item">🎬 Películas</div>
        <div class="nav-item">📺 Series</div>
        <div class="nav-item">🍥 Anime</div>
    </div>
</aside>

<main class="main-content" id="app"></main>

<div id="player" class="player-overlay">
    <span class="close-btn" onclick="closeVideo()">✕</span>
    <video id="videoElement" controls playsinline></video>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const workerURL = "https://morning-glade-ac23.rigobertin100.workers.dev";

    function fixUrl(path) {
        if (!path) return "";
        // Si el path ya contiene el worker, lo limpiamos para no duplicar
        const cleanPath = path.includes('?file=') ? path.split('?file=').pop() : path;
        return `${workerURL}?file=${encodeURIComponent(decodeURIComponent(cleanPath))}`;
    }

    function createCard(item) {
        const div = document.createElement('div');
        div.className = 'card';
        const imgUrl = fixUrl(item.img || item.image);

        div.innerHTML = `
            <div class="card-inner">
                <div class="card-fallback">${item.titulo}</div>
                <img src="${imgUrl}" onerror="this.style.opacity='0'">
            </div>
            <div class="card-title">${item.titulo}</div>
        `;

        div.onclick = () => openVideo(fixUrl(item.url));
        return div;
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            fetch(workerURL)
                .then(r => r.json())
                .then(data => {
                    const main = document.getElementById('app');
                    main.innerHTML = '<section class="row"><h2>Mi Contenido</h2><div class="carousel" id="container"></div></section>';
                    const container = document.getElementById('container');
                    data.forEach(item => container.appendChild(createCard(item)));
                    document.getElementById('loader').style.display = 'none';
                });
        } else {
            location.href = 'login.html';
        }
    });

    window.openVideo = (url) => {
        const p = document.getElementById('player');
        const v = document.getElementById('videoElement');
        p.style.display = 'block';
        if(url.includes('.m3u8')) {
            if(Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(v);
                hls.on(Hls.Events.MANIFEST_PARSED, () => v.play());
            }
        } else {
            v.src = url;
            v.play();
        }
    };

    window.closeVideo = () => {
        document.getElementById('videoElement').pause();
        document.getElementById('player').style.display = 'none';
    };
</script>

<style> @keyframes spin { to { transform: rotate(360deg); } } </style>
</body>
</html>
