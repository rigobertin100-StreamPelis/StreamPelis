<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlusUltra Pro</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/cv/js/cast_sender.js"></script>
    <script src="https://luke-chang.github.io/js-spatial-navigation/spatial_navigation.js"></script>
    
    <script>
    window.castAvailable = false;
    window['__onGCastApiAvailable'] = function(isAvailable) {
      if (isAvailable && window.cast && window.chrome) {
        window.castAvailable = true;
        const btn = document.getElementById("castBtn");
        if (btn) btn.style.display = "inline-block";
      }
    };
    </script>

    <style>
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;background:linear-gradient(to bottom,#1c1c1e,#2c2c2e);color:white;padding-top:90px;overflow-x:hidden;}
        .header{position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;z-index:1000;background:rgba(28,28,30,.35);backdrop-filter:blur(25px);transition:.3s;border-bottom:1px solid rgba(255,255,255,.1);box-sizing:border-box;}
        .header.scrolled{background:rgba(28,28,30,.9);box-shadow:0 10px 30px rgba(0,0,0,.5);}
        
        .tv-mode { backdrop-filter: none !important; background: #1c1c1e !important; }
        .tv-mode .header, .tv-mode .series-modal { backdrop-filter: none !important; background: rgba(28,28,30,0.98) !important; }
        
        :focus {
            outline: 6px solid #ccff00 !important;
            outline-offset: 3px;
            transform: scale(1.08);
            z-index: 99999 !important;
            box-shadow: 0 0 25px rgba(204, 255, 0, 0.7);
        }

        .logo{font-size:34px;font-weight:700;color:#0a84ff;}
        .header-right{display:flex;align-items:center;gap:12px;}
        .search{padding:10px 18px;border-radius:24px;border:none;width:260px;font-size:16px;background:rgba(255,255,255,.1);color:white;outline:none;}
        .logout{white-space:nowrap;padding:10px 14px;border:none;border-radius:12px;background:#ff3b30;color:#fff;cursor:pointer;font-weight:bold;}
        
        .hero-banner {position: relative; width: 100%; height: 70vh; background: #000; overflow: hidden; margin-top: -90px; display: none;}
        .hero-video-bg {position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; transform: translate(-50%, -50%); pointer-events: none;}
        .hero-overlay {position: absolute; inset: 0; background: linear-gradient(to right, rgba(28,28,30,0.9) 10%, transparent 70%), linear-gradient(to top, #1c1c1e 5%, transparent 50%); display: flex; flex-direction: column; justify-content: center; padding: 0 50px; z-index: 2;}
        #heroTitle {font-size: clamp(30px, 5vw, 60px); margin: 0; color: #fff; text-transform: uppercase; max-width: 50%; line-height: 1.1;}
        .hero-btn {width: fit-content; padding: 14px 35px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 25px; transition: 0.2s;}

        .row{margin-top:40px;padding-left:20px;}
        .row h2{font-size:22px;margin-bottom:14px;color:rgba(255,255,255,0.9);}
        .carousel{display:flex;gap:18px;overflow-x:auto;padding-bottom:20px;scroll-behavior:smooth;}
        .carousel::-webkit-scrollbar{height:6px;}
        .carousel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:10px;}
        
        .card{width:220px;flex-shrink:0;aspect-ratio:2/3;position:relative;border-radius:20px;overflow:hidden;cursor:pointer;transition:0.3s; background: #2c2c2e;}
        .card img{width:100%;height:100%;object-fit:cover;}

        .loading-sentinel { min-width: 100px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #0a84ff; font-weight: bold; }
        
        .series-modal{position:fixed;inset:0;display:none;justify-content:center;align-items:center;z-index:5000; background:rgba(28,28,30,0.98);backdrop-filter:blur(20px);}
        .player{position:fixed;inset:0;display:none;justify-content:center;align-items:center;z-index:9000; background:#000;}

        .player-inner,.series-inner{width:92vw;height:88vh;background:#1c1c1e;border-radius:24px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;padding:20px;}
        video{width:100%;height:100%;border-radius:15px;background:#000;}
        
        .close{position:absolute;top:20px;right:25px;font-size:30px;cursor:pointer;color:white;z-index:100;}
        .player-nav{position:absolute;top:20px;left:25px;z-index:100;display:flex;gap:10px;}
        .player-nav button, .episode-list button, .continue-btn{padding:10px 16px;border:none;border-radius:12px;background:#0a84ff;color:#fff;cursor:pointer;font-weight:600;}
        
        .episode-list{width:100%;display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;overflow-y:auto;}
        
        #loginModal{position:fixed;inset:0;background:#000;display:flex;justify-content:center;align-items:center;z-index:9999999;}
        #loginBox{background:#1c1c1e;padding:40px;border-radius:28px;display:flex;flex-direction:column;gap:16px;width:320px;}
        #loginBox input{padding:14px;border-radius:12px;border:none;background:#2c2c2e;color:white;font-size:16px;}
        #loginBox button{padding:14px;border:none;border-radius:12px;background:#0a84ff;color:#fff;font-weight:bold;cursor:pointer;}
        
        .continue-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:15px;gap:8px;}
        .continue-info{font-size:12px;color:#0a84ff;font-weight:bold;}
        .continue-line{height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden;}
        .continue-progress{height:100%;background:#0a84ff;}
        
        .season-option {padding:10px 15px;background:rgba(255,255,255,0.1);border-radius:10px;cursor:pointer;white-space:nowrap; border: 2px solid transparent;}
        .season-option.active {background:#0a84ff; border-color: white;}
    </style>
</head>

<body>

<div id="loginModal">
    <div id="loginBox">
        <h2 style="text-align:center">PlusUltra</h2>
        <input id="loginUser" type="email" placeholder="Correo" tabindex="1">
        <input id="loginPass" type="password" placeholder="Contraseña" tabindex="2">
        <button id="loginBtn" tabindex="3">Ingresar</button>
        <p id="loginError" style="color:#ff453a; display:none; text-align:center">Credenciales incorrectas</p>
    </div>
</div>

<div class="header">
    <div class="logo">PlusUltra</div>
    <div class="header-right">
        <input id="search" class="search" placeholder="Buscar..." tabindex="0">
        <button class="logout" onclick="logout()" tabindex="0">Salir</button>
    </div>
</div>

<div id="heroBanner" class="hero-banner">
    <div id="youtubePlayer" class="hero-video-bg"></div>
    <div class="hero-overlay">
        <h1 id="heroTitle"></h1>
        <p id="heroDesc" style="font-size: 18px; color: rgba(255,255,255,0.7); margin: 10px 0;">Ya disponible en PlusUltra Cine</p>
        <button id="heroPlayBtn" class="hero-btn" tabindex="0">▶ Ver Película</button>
    </div>
</div>

<div id="app"></div>

<div class="player" id="player">
    <div class="player-inner">
        <span class="close" onclick="window.closeVideo()" tabindex="0">✕</span>
        <div class="player-nav" id="playerNav">
            <button id="btnPrev" onclick="window.prevEpisode()" tabindex="0">⏮</button>
            <button id="btnRew" onclick="document.getElementById('video').currentTime -= 10" tabindex="0">-10s</button>
            <button id="btnFwd" onclick="document.getElementById('video').currentTime += 10" tabindex="0">+10s</button>
            <button id="btnNext" onclick="window.nextEpisode()" tabindex="0">⏭</button>
            <button id="btnFull" onclick="window.toggleFullScreen()" tabindex="0">⛶ Fullscreen</button>
            <button id="castBtn" onclick="castVideo()" style="display:none;" tabindex="0">📺 Cast</button>
        </div>
        <video id="video" controls></video>
    </div>
</div>

<div class="series-modal" id="seriesModal">
    <div class="series-inner">
        <span class="close" onclick="window.closeSeriesModal()" tabindex="0">✕</span>
        <h2 id="seriesTitle"></h2>
        <div id="seasonSelect" style="display:flex; gap:10px; overflow-x:auto; width:100%; margin-bottom:10px;"></div>
        <div class="episode-list" id="episodeList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
    authDomain: "midata-40f73.firebaseapp.com",
    projectId: "midata-40f73",
    storageBucket: "midata-40f73.firebasestorage.app",
    messagingSenderId: "104287406146",
    appId: "1:104287406146:web:d9fad446e22629559dc5db"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
localStorage.setItem("sessionId", sessionId);

let allVideos = [];
let currentSeries = null;
let currentSeason = 0;
let currentEpisode = 0;
let sessionInterval = null;

const SEGMENT_SIZE = 10;
const loadedCounts = {};

function initTVNavigation() {
    if (window.SpatialNavigation) {
        SpatialNavigation.init();
        SpatialNavigation.add({ id: 'main', selector: '.card, .hero-btn, .logout, .search, #loginBtn, #loginBox input' });
        SpatialNavigation.add({ id: 'modal', selector: '.series-modal .season-option, .series-modal .episode-list button, .series-modal .close' });
        SpatialNavigation.add({ id: 'player', selector: '.player .player-nav button, .player .close' });
        SpatialNavigation.makeFocusable();
        
        window.addEventListener('keydown', (e) => {
            const playerOpen = document.getElementById("player").style.display === "flex";
            const modalOpen = document.getElementById("seriesModal").style.display === "flex";
            const isFullScreen = !!(document.fullscreenElement || document.webkitFullscreenElement);

            if (e.keyCode === 13) { const active = document.activeElement; if (active) active.click(); }
            
            // Lógica de botón ATRAS / ESC / BACK
            if (e.keyCode === 27 || e.keyCode === 8 || e.keyCode === 461 || e.keyCode === 10009) {
                if (isFullScreen) {
                    e.preventDefault();
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else if (playerOpen) {
                    e.preventDefault();
                    window.closeVideo();
                } else if (modalOpen) {
                    e.preventDefault();
                    window.closeSeriesModal();
                }
            }
        }, true);
    }
}

function switchFocusGroup(groupId) {
    if (window.SpatialNavigation) {
        SpatialNavigation.disable('main'); SpatialNavigation.disable('modal'); SpatialNavigation.disable('player');
        SpatialNavigation.enable(groupId); SpatialNavigation.focus(groupId);
    }
}

window.toggleFullScreen = () => {
    const video = document.getElementById("video");
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
};

function applyTVOptimizations() {
    const ua = navigator.userAgent.toLowerCase();
    const isTV = /smart-tv|tizen|webos|hisense|apple-tv|googletv/.test(ua);
    if (isTV) document.body.classList.add("tv-mode");
}

async function registerSession(user) {
    try {
        const ref = doc(db, "users", user.uid);
        const snap = await getDoc(ref);
        let sessions = snap.exists() ? snap.data().sessions || [] : [];
        sessions = sessions.filter(s => s.id !== sessionId);
        sessions.push({ id: sessionId, lastSeen: Date.now() });
        if (sessions.length > 2) sessions = sessions.slice(-2);
        await setDoc(ref, { sessions }, { merge: true });
    } catch (e) { console.error(e); }
}

async function validateSession(user) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) return true;
    return (snap.data().sessions || []).some(s => s.id === sessionId);
}

function startSessionWatcher(user) {
    sessionInterval = setInterval(async () => {
        if (!(await validateSession(user))) signOut(auth).then(()=> location.reload());
    }, 15000);
}

const STORAGE_KEY="plus_ultra_progress";
const getProgress = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

const playerController = {
    video: null, hls: null, currentId: null,
    init(){
        this.video = document.getElementById("video");
        this.video.ontimeupdate = () => {
            if(this.currentId && this.video.currentTime > 5) {
                const data = getProgress();
                data[this.currentId] = { time: this.video.currentTime, duration: this.video.duration, updated: Date.now(), season: currentSeries ? currentSeason : null, episode: currentSeries ? currentEpisode : null };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }
        };
        this.video.onended = () => currentSeries ? window.nextEpisode() : window.closeVideo();
    },
    play(v){
        this.cleanup();
        this.currentId = currentSeries ? currentSeries.titulo : v.titulo;
        
        // MOSTRAR U OCULTAR BOTONES SEGUN TIPO
        const isSerie = currentSeries && (currentSeries.tipo === "serie" || currentSeries.tipo === "anime");
        document.getElementById("btnPrev").style.display = isSerie ? "inline-block" : "none";
        document.getElementById("btnNext").style.display = isSerie ? "inline-block" : "none";

        const saved = getProgress()[this.currentId];
        if(v.url.includes(".m3u8") && Hls.isSupported()){
            this.hls = new Hls(); this.hls.loadSource(v.url); this.hls.attachMedia(this.video);
            this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if(saved && (!currentSeries || (saved.season === currentSeason && saved.episode === currentEpisode))) this.video.currentTime = saved.time;
                this.video.play();
            });
        } else {
            this.video.src = v.url;
            this.video.onloadedmetadata = () => {
                if(saved && (!currentSeries || (saved.season === currentSeason && saved.episode === currentEpisode))) this.video.currentTime = saved.time;
                this.video.play();
            };
        }
    },
    cleanup(){ if(this.hls) this.hls.destroy(); this.video.pause(); this.video.src = ""; }
};

window.openVideo = (v) => {
    document.getElementById("seriesModal").style.display = "none";
    document.getElementById("player").style.display = "flex";
    playerController.play(v); switchFocusGroup('player');
};

window.closeVideo = () => {
    playerController.cleanup(); document.getElementById("player").style.display = "none";
    if (currentSeries) { document.getElementById("seriesModal").style.display = "flex"; switchFocusGroup('modal'); }
    else switchFocusGroup('main');
    renderContinue(5);
};

window.openSeriesModal = (series) => {
    currentSeries = series; currentSeason = 0;
    document.getElementById("seriesModal").style.display = "flex";
    document.getElementById("seriesTitle").innerText = series.titulo;
    const box = document.getElementById("seasonSelect"); box.innerHTML = "";
    if(!series.temporadas || series.temporadas.length === 0) { document.getElementById("episodeList").innerHTML = "Próximamente..."; return; }
    series.temporadas.forEach((t, i) => {
        const opt = document.createElement("div"); opt.className = `season-option ${i===currentSeason?'active':''}`; opt.innerText = t.numero; opt.tabIndex = 0;
        opt.onclick = () => { currentSeason = i; document.querySelectorAll(".season-option").forEach(el=>el.classList.remove("active")); opt.classList.add("active"); renderEpisodes(i); };
        box.appendChild(opt);
    });
    renderEpisodes(currentSeason); switchFocusGroup('modal');
};

function renderEpisodes(idx){
    const list = document.getElementById("episodeList"); list.innerHTML = "";
    currentSeries.temporadas[idx].episodios.forEach((ep, i) => {
        const btn = document.createElement("button"); btn.innerText = ep.titulo; btn.tabIndex = 0;
        btn.onclick = () => { currentEpisode = i; window.openVideo(ep); };
        list.appendChild(btn);
    });
    if (window.SpatialNavigation) SpatialNavigation.makeFocusable();
}

window.nextEpisode = () => {
    if (!currentSeries) return;
    const s = currentSeries.temporadas[currentSeason];
    if(currentEpisode < s.episodios.length - 1) { 
        currentEpisode++; 
        window.openVideo(s.episodios[currentEpisode]); 
    } else if (currentSeason < currentSeries.temporadas.length - 1) { 
        currentSeason++; 
        currentEpisode = 0; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    }
};

window.prevEpisode = () => {
    if (!currentSeries) return;
    if(currentEpisode > 0) { 
        currentEpisode--; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    } else if (currentSeason > 0) { 
        currentSeason--; 
        currentEpisode = currentSeries.temporadas[currentSeason].episodios.length - 1; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    }
};

window.closeSeriesModal = () => { document.getElementById("seriesModal").style.display = "none"; currentSeries = null; switchFocusGroup('main'); };

async function setupHeroBanner() {
    const cinePelis = allVideos.filter(v => v.tipo === "cine"); if (cinePelis.length === 0) return;
    const ultimaPeli = cinePelis[cinePelis.length - 1];
    document.getElementById("heroBanner").style.display = "block";
    document.getElementById("heroTitle").innerText = ultimaPeli.titulo;
    document.getElementById("heroPlayBtn").onclick = () => { currentSeries = null; window.openVideo(ultimaPeli); };
    const txtUrl = ultimaPeli.img.substring(0, ultimaPeli.img.lastIndexOf('.')) + ".txt";
    let manualVideoId = null; try { const response = await fetch(txtUrl); if (response.ok) manualVideoId = (await response.text()).trim(); } catch (e) {}
    let finalSrc = (manualVideoId && manualVideoId.length < 15) ? `https://www.youtube.com/embed/${manualVideoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${manualVideoId}&rel=0` : `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(ultimaPeli.titulo + " trailer oficial")}&autoplay=1&mute=1&controls=0`;
    document.getElementById("youtubePlayer").innerHTML = `<iframe width="100%" height="100%" src="${finalSrc}" frameborder="0" allow="autoplay"></iframe>`;
}

function buildUI(){
    document.getElementById("app").innerHTML = `
        <div class="row"><h2>🆕 Recién agregadas</h2><div class="carousel" id="recentRow"></div></div>
        <div class="row" id="contHeader"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
        <div class="row"><h2>🍿 Cine</h2><div class="carousel" id="cineRow"></div></div>
        <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
        <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
        <div class="row"><h2>🍥 Anime</h2><div class="carousel" id="animeRow"></div></div>`;
    renderAll(); setupHeroBanner(); initTVNavigation(); switchFocusGroup('main');
}

function renderAll(){
    const sections = [ { id: "recentRow", data: [...allVideos].slice(-30).reverse() }, { id: "peliculasRow", data: allVideos.filter(v => v.tipo === "pelicula").reverse() }, { id: "seriesRow", data: allVideos.filter(v => v.tipo === "serie").reverse() }, { id: "cineRow", data: allVideos.filter(v => v.tipo === "cine").reverse() }, { id: "animeRow", data: allVideos.filter(v => v.tipo === "anime").reverse() } ];
    sections.forEach(section => {
        const container = document.getElementById(section.id); if(!container) return;
        container.innerHTML = ""; loadedCounts[section.id] = 0; loadNextSegment(section.id, section.data);
        const sentinel = document.createElement("div"); sentinel.className = "loading-sentinel"; sentinel.innerText = "•••"; container.appendChild(sentinel);
        new IntersectionObserver((entries) => { if (entries[0].isIntersecting) loadNextSegment(section.id, section.data); }, { root: container, threshold: 0.1 }).observe(sentinel);
    });
    renderContinue(5);
}

function loadNextSegment(containerId, sourceData) {
    const container = document.getElementById(containerId); const sentinel = container.querySelector(".loading-sentinel");
    const start = loadedCounts[containerId]; const segment = sourceData.slice(start, start + SEGMENT_SIZE);
    segment.forEach(v => { const card = createCard(v); sentinel ? container.insertBefore(card, sentinel) : container.appendChild(card); });
    loadedCounts[containerId] = start + SEGMENT_SIZE;
    if (loadedCounts[containerId] >= sourceData.length && sentinel) sentinel.style.display = "none";
    if (window.SpatialNavigation) SpatialNavigation.makeFocusable();
}

function createCard(v){
    const card = document.createElement("div"); card.className = "card"; card.tabIndex = 0; card.dataset.title = v.titulo.toLowerCase();
    card.innerHTML = `<img src="${v.img}" loading="lazy">`;
    card.onclick = () => (v.tipo === "serie" || v.tipo === "anime") ? window.openSeriesModal(v) : window.openVideo(v);
    return card;
}

function renderContinue(limite = 5) {
    const data = getProgress(); const row = document.getElementById("continueRow"); const container = document.getElementById("contHeader"); if (!row || !container) return;
    row.innerHTML = "";
    let list = Object.keys(data).map(id => { const base = allVideos.find(v => v.titulo.trim() === id.trim()); return base ? { ...base, _prog: data[id] } : null; }).filter(v => v && v._prog.time > 5 && v._prog.time < v._prog.duration * 0.95);
    list.sort((a, b) => b._prog.updated - a._prog.updated);
    const finalDisplay = list.slice(0, limite); container.style.display = finalDisplay.length === 0 ? "none" : "block";
    finalDisplay.forEach(v => {
        const p = v._prog; const pct = (p.time / p.duration) * 100;
        let infoTexto = (v.tipo === "serie" || v.tipo === "anime") ? `T${(p.season || 0) + 1}:E${(p.episode || 0) + 1} • ${Math.ceil((p.duration - p.time)/60)} min` : `Faltan ${Math.ceil((p.duration - p.time)/60)} min`;
        const card = createCard(v); card.innerHTML += `<div class="continue-overlay"><div class="continue-info">${infoTexto}</div><div class="continue-line"><div class="continue-progress" style="width:${pct}%"></div></div></div>`;
        card.onclick = () => { if (v.tipo === "serie" || v.tipo === "anime") { currentSeries = v; currentSeason = p.season || 0; currentEpisode = p.episode || 0; window.openVideo(v.temporadas[currentSeason].episodios[currentEpisode]); } else { currentSeries = null; window.openVideo(v); } };
        row.appendChild(card);
    });
}

document.getElementById("search").addEventListener("keydown", (e) => { if (e.key === "Enter") { const val = e.target.value.toLowerCase().trim(); document.querySelectorAll(".card").forEach(c => { c.style.display = (c.dataset.title || "").includes(val) ? "block" : "none"; }); if (val !== "") e.target.blur(); } });

document.getElementById("loginBtn").onclick = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById("loginUser").value, document.getElementById("loginPass").value); } catch(e) { document.getElementById("loginError").style.display = "block"; } };

onAuthStateChanged(auth, async (user) => {
