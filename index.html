<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusUltra Pro</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.ibb.co/3S7vX2P/logo-512.png">
    <meta name="theme-color" content="#1c1c1e">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: white; padding-top: 85px; overflow-x: hidden; }

        /* LOADER */
        #mainLoader { position: fixed; inset: 0; background: #1c1c1e; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000000; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: #0a84ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* HEADER */
        .header { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; z-index: 9999; background: rgba(28, 28, 30, .8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, .05); }
        .logo { font-size: 26px; font-weight: 800; color: #0a84ff; letter-spacing: -1px; }
        .search { padding: 10px 15px; border-radius: 12px; border: none; background: rgba(255, 255, 255, .1); color: white; width: 140px; }
        .logout { padding: 10px 15px; border: none; border-radius: 12px; background: #ff3b30; color: white; font-weight: bold; margin-left: 10px; }

        /* FILAS Y CARROUSEL */
        .row { margin-top: 25px; padding-left: 20px; }
        .row h2 { font-size: 19px; margin-bottom: 12px; font-weight: 700; color: #efeff4; }
        .carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
        .carousel::-webkit-scrollbar { display: none; }
        
        .card { width: 160px; flex-shrink: 0; aspect-ratio: 2/3; background: #2c2c2e; border-radius: 14px; overflow: hidden; position: relative; scroll-snap-align: start; }
        .card img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s ease; }

        /* REPRODUCTOR Y GESTOS */
        .player { position: fixed; inset: 0; display: none; background: #000; z-index: 100000; }
        .video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; }
        video { width: 100%; height: 100%; }
        .gesture-area { position: absolute; top: 0; width: 35%; height: 85%; z-index: 10; }
        .left-area { left: 0; }
        .right-area { right: 0; }
        .feedback-toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; pointer-events: none; opacity: 0; z-index: 20; }
        .close-btn { position: absolute; top: 35px; right: 20px; z-index: 100; font-size: 30px; color: white; cursor: pointer; }

        /* BARRAS DE PROGRESO */
        .continue-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); }
        .continue-fill { height: 100%; background: #0a84ff; }
        .ep-info { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); padding: 3px 7px; border-radius: 5px; font-size: 10px; font-weight: bold; }

        /* MODALES */
        .modal-full { position: fixed; inset: 0; display: none; background: #1c1c1e; z-index: 99999; padding: 20px; overflow-y: auto; }
        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .episode-grid button { padding: 12px; border-radius: 10px; border: none; background: #2c2c2e; color: white; font-weight: 600; }

        #loginModal { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000001; }
        .login-box { background: #1c1c1e; padding: 30px; border-radius: 24px; width: 310px; display: flex; flex-direction: column; gap: 15px; }
        .login-box input { padding: 12px; border-radius: 12px; border: none; background: #2c2c2e; color: white; font-size: 16px; }
        .login-box button { padding: 12px; border-radius: 12px; border: none; background: #0a84ff; color: white; font-weight: 700; }
    </style>
</head>
<body>

<div id="mainLoader">
    <div class="spinner"></div>
</div>

<div class="header">
    <div class="logo">PlusUltra</div>
    <div style="display:flex; align-items:center;">
        <input id="searchField" class="search" placeholder="Buscar...">
        <button class="logout" onclick="logout()">Salir</button>
    </div>
</div>

<div id="app"></div>

<div class="player" id="player">
    <span class="close-btn" onclick="closeVideo()">✕</span>
    <div class="video-container">
        <div class="gesture-area left-area" id="leftGesture"></div>
        <div class="gesture-area right-area" id="rightGesture"></div>
        <div id="feedbackToast" class="feedback-toast"></div>
        <video id="video" playsinline controls></video>
    </div>
</div>

<div class="modal-full" id="seriesModal">
    <span class="close-btn" onclick="closeSeriesModal()">✕</span>
    <h2 id="seriesTitle" style="margin-top:50px;"></h2>
    <div id="seasonSelect" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:10px;"></div>
    <div class="episode-grid" id="episodeList"></div>
</div>

<div id="loginModal" style="display:none">
    <div class="login-box">
        <h2 style="margin:0; text-align:center">PlusUltra</h2>
        <input id="loginUser" type="email" placeholder="Usuario">
        <input id="loginPass" type="password" placeholder="Contraseña">
        <button id="loginBtn">Entrar</button>
        <p id="loginError" style="color:#ff453a; font-size:13px; text-align:center; display:none"></p>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
    authDomain: "midata-40f73.firebaseapp.com",
    projectId: "midata-40f73",
    storageBucket: "midata-40f73.firebasestorage.app",
    messagingSenderId: "104287406146",
    appId: "1:104287406146:web:d9fad446e22629559dc5db"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allVideos = [];
let currentUser = null;
let currentSeries = null;
let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if(entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.onload = () => img.style.opacity = 1;
            observer.unobserve(img);
        }
    });
}, { rootMargin: "400px" });

const videoPlayer = {
    el: document.getElementById("video"),
    hls: null,
    async play(v) {
        this.stop();
        let progress = null;
        if(currentUser) {
            const snap = await getDoc(doc(db, "users", currentUser.uid, "progress", v.titulo.replace(/\//g, '_')));
            if(snap.exists()) progress = snap.data();
        }

        if(v.url.includes(".m3u8")) {
            this.hls = new Hls(); this.hls.loadSource(v.url); this.hls.attachMedia(this.el);
            this.hls.on(Hls.Events.MANIFEST_PARSED, () => { if(progress) this.el.currentTime = progress.time; this.el.play(); });
        } else {
            this.el.src = v.url;
            this.el.onloadedmetadata = () => { if(progress) this.el.currentTime = progress.time; this.el.play(); };
        }

        this.el.ontimeupdate = () => {
            const t = this.el.currentTime, d = this.el.duration;
            if(currentUser && Math.floor(t) % 15 === 0) {
                const data = JSON.parse(localStorage.getItem("progress") || "{}");
                data[v.titulo] = { time: t, duration: d, img: v.img, epInfo: v.epInfo || "" };
                localStorage.setItem("progress", JSON.stringify(data));
                setDoc(doc(db, "users", currentUser.uid, "progress", v.titulo.replace(/\//g, '_')), 
                { time: t, duration: d, img: v.img, epInfo: v.epInfo || "", last: Date.now() }, { merge: true });
            }
        };
    },
    stop() { if(this.hls) { this.hls.destroy(); this.hls = null; } this.el.pause(); this.el.load(); }
};

// GESTOS
const toast = document.getElementById("feedbackToast");
document.getElementById("leftGesture").onclick = (e) => { if(e.detail === 2) { videoPlayer.el.currentTime -= 10; toast.innerText = "⏪ -10s"; toast.style.opacity = 1; setTimeout(()=>toast.style.opacity=0,600); } };
document.getElementById("rightGesture").onclick = (e) => { if(e.detail === 2) { videoPlayer.el.currentTime += 10; toast.innerText = "⏩ +10s"; toast.style.opacity = 1; setTimeout(()=>toast.style.opacity=0,600); } };

// RENDERIZADO ESTRICTO
function renderRow(list, containerId) {
    const container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = "";
    list.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<img data-src="${v.img}" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">`;
        card.onclick = () => (v.tipo?.toLowerCase().includes("serie") || v.tipo?.toLowerCase().includes("anime")) ? openSeries(v) : openVideo(v);
        container.appendChild(card);
        observer.observe(card.querySelector("img"));
    });
}

function renderHybrid(tag, containerId) {
    const pool = allVideos.filter(v => v.tipo?.toLowerCase() === tag.toLowerCase());
    if(pool.length === 0) return;
    const novedades = [...pool].reverse().slice(0, 10);
    const resto = pool.filter(v => !novedades.includes(v)).sort(() => 0.5 - Math.random());
    renderRow([...novedades, ...resto], containerId);
}

function renderContinue() {
    const data = JSON.parse(localStorage.getItem("progress") || "{}");
    const row = document.getElementById("continueRow");
    if(!row || Object.keys(data).length === 0) return;
    document.getElementById("continueSection").style.display = "block";
    row.innerHTML = "";
    Object.keys(data).reverse().slice(0, 5).forEach(title => {
        const item = data[title];
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<img src="${item.img}" style="opacity:1">${item.epInfo ? `<div class="ep-info">${item.epInfo}</div>`:''}<div class="continue-bar"><div class="continue-fill" style="width:${(item.time/item.duration)*100}%"></div></div>`;
        card.onclick = () => { const v = allVideos.find(x => x.titulo === title); if(v) openVideo(v); };
        row.appendChild(card);
    });
}

window.openVideo = (v) => { document.getElementById("player").style.display = "block"; videoPlayer.play(v); };
window.closeVideo = () => { videoPlayer.stop(); document.getElementById("player").style.display = "none"; renderContinue(); };

window.openSeries = (s) => {
    currentSeries = s;
    document.getElementById("seriesModal").style.display = "block";
    document.getElementById("seriesTitle").innerText = s.titulo;
    fetch(s.temporadasUrl).then(r => r.json()).then(temps => {
        const nav = document.getElementById("seasonSelect"); nav.innerHTML = "";
        temps.forEach((t, i) => {
            const b = document.createElement("button"); b.innerText = `T${t.numero}`;
            b.onclick = () => renderEpisodes(i); nav.appendChild(b);
        });
        renderEpisodes(0);
    });
};

function renderEpisodes(idx) {
    const list = document.getElementById("episodeList"); list.innerHTML = "";
    currentSeries.temps[idx].episodios.forEach(ep => {
        const b = document.createElement("button"); b.innerText = ep.titulo;
        ep.epInfo = `T${currentSeries.temps[idx].numero} - ${ep.titulo}`;
        b.onclick = () => openVideo(ep); list.appendChild(b);
    });
}

window.closeSeriesModal = () => document.getElementById("seriesModal").style.display = "none";

onAuthStateChanged(auth, async (user) => {
    if(user) {
        currentUser = user;
        document.getElementById("loginModal").style.display = "none";
        await setDoc(doc(db, "users", user.uid), { last: Date.now(), sessionId }, { merge: true });
        
        fetch("https://small-king-30c8.rigobertin100.workers.dev")
            .then(r => r.json())
            .then(data => {
                allVideos = data;
                document.getElementById("app").innerHTML = `
                    <div class="row"><h2>🆕 Agregadas recientemente</h2><div class="carousel" id="recentRow"></div></div>
                    <div id="continueSection" class="row" style="display:none"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
                    <div class="row"><h2>🍿 Del Cine a tu Casa</h2><div class="carousel" id="cineRow"></div></div>
                    <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
                    <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
                    <div class="row"><h2>🍥 Anime</h2><div class="carousel" id="animeRow"></div></div>
                `;
                
                // 1. Recientes (Estricto 10 últimas)
                renderRow([...allVideos].reverse().slice(0, 10), "recentRow");

                // 2. Categorías Híbridas (10 Nuevas + Random)
                renderHybrid("cine", "cineRow");
                renderHybrid("pelicula", "peliculasRow");
                renderHybrid("serie", "seriesRow");
                renderHybrid("anime", "animeRow");
                
                renderContinue();
                document.getElementById("mainLoader").style.display = "none";
            });
    } else {
        document.getElementById("loginModal").style.display = "flex";
        document.getElementById("mainLoader").style.display = "none";
    }
});

window.logout = () => signOut(auth).then(() => location.reload());
document.getElementById("loginBtn").onclick = () => {
    signInWithEmailAndPassword(auth, document.getElementById("loginUser").value, document.getElementById("loginPass").value)
    .catch(() => { document.getElementById("loginError").style.display = "block"; });
};
</script>
</body>
</html>
