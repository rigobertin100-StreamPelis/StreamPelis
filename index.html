<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlusUltra Universal</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #0a84ff; --bg: #111; --card-bg: #1c1c1e; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: white; padding-top: 80px; }
        
        /* Header */
        .header { position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 4%; background: rgba(28,28,30,0.9); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid #333; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); cursor: pointer; }
        .nav-tools { display: flex; gap: 10px; }
        .logout { padding: 8px 15px; background: #ff3b30; border: none; border-radius: 20px; color: white; cursor: pointer; }

        /* Contenido */
        .row { padding: 0 4%; margin-bottom: 30px; }
        .carousel { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
        
        .card { width: 160px; flex-shrink: 0; aspect-ratio: 2/3; background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* Reproductor */
        .player { position: fixed; inset: 0; background: #000; display: none; z-index: 9999; }
        video { width: 100%; height: 100%; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; z-index: 10001; }
        
        #loader { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 20000; }
    </style>
</head>
<body>

<div id="loader">Cargando catálogo...</div>

<header class="header">
    <div class="logo">PlusUltra</div>
    <div class="nav-tools">
        <button class="logout" onclick="logout()">Salir</button>
    </div>
</header>

<main id="app"></main>

<div class="player" id="player">
    <span class="close-btn" onclick="closeVideo()">×</span>
    <video id="video" controls></video>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const WORKER_URL = "https://morning-glade-ac23.rigobertin100.workers.dev";

    let allVideos = [];

    // 1. Cargar Datos
    async function loadContent() {
        try {
            const res = await fetch(WORKER_URL);
            allVideos = await res.json();
            renderAll();
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            console.error("Error cargando el Worker:", e);
            document.getElementById('loader').innerText = "Error de conexión con el servidor";
        }
    }

    function renderAll() {
        const categories = [
            { title: "🆕 Novedades", list: allVideos.slice(0, 10) },
            { title: "🎬 Películas", list: allVideos.filter(v => v.tipo === 'pelicula') },
            { title: "📺 Series", list: allVideos.filter(v => v.tipo === 'serie') },
            { title: "🍥 Anime", list: allVideos.filter(v => v.tipo === 'anime') },
            { title: "🍿 Cine", list: allVideos.filter(v => v.tipo === 'cine') }
        ];

        const appEl = document.getElementById('app');
        appEl.innerHTML = categories.map(cat => `
            <div class="row">
                <h2>${cat.title}</h2>
                <div class="carousel">${cat.list.map(v => `
                    <div class="card" onclick='openVideo(${JSON.stringify(v)})'>
                        <img src="${v.imagen || 'https://via.placeholder.com/200x300?text=No+Img'}" 
                             onerror="this.src='https://via.placeholder.com/200x300?text=Error'">
                    </div>
                `).join('')}</div>
            </div>
        `).join('');
    }

    // 2. Control del Reproductor
    window.openVideo = (v) => {
        const player = document.getElementById('player');
        const video = document.getElementById('video');
        player.style.display = 'block';
        
        if (v.video.includes('.m3u8')) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(v.video);
                hls.attachMedia(video);
            }
        } else {
            video.src = v.video;
        }
        video.play();
    };

    window.closeVideo = () => {
        const video = document.getElementById('video');
        video.pause();
        video.src = "";
        document.getElementById('player').style.display = 'none';
    };

    // 3. Auth
    onAuthStateChanged(auth, (user) => {
        if (user) { loadContent(); } 
        else { window.location.href = "login.html"; }
    });

    window.logout = () => signOut(auth);
</script>
</body>
</html>
