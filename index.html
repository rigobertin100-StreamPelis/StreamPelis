<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PlusUltra Universal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #000; --card-bg: #1c1c1e; --primary: #0a84ff; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, system-ui, sans-serif; overflow-x: hidden; }
        
        /* Header Estilo iOS */
        .header { position: fixed; top: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 0.5px solid #333; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); }
        .search-bar { background: #2c2c2e; border: none; border-radius: 10px; padding: 8px 15px; color: white; width: 250px; }
        .btn-exit { background: #ff3b30; border: none; border-radius: 8px; color: white; padding: 6px 15px; font-weight: 600; cursor: pointer; }

        /* Contenedor Principal */
        #app { padding: 80px 20px 20px; }
        .row { margin-bottom: 30px; }
        .row h2 { font-size: 20px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .carousel { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scroll-behavior: smooth; }
        .carousel::-webkit-scrollbar { display: none; }

        /* Cards PlusUltra */
        .card { width: 150px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: var(--card-bg); transition: transform 0.3s; cursor: pointer; position: relative; aspect-ratio: 2/3; }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-title { position: absolute; bottom: 0; width: 100%; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); font-size: 11px; font-weight: 500; text-align: center; }
        
        /* Fallback si no hay imagen de R2 */
        .no-img { display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; background: #2c2c2e; height: 100%; color: #8e8e93; font-size: 12px; }

        /* Player */
        .player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        video { width: 100%; height: 100%; }
        .close-player { position: absolute; top: 20px; right: 20px; font-size: 24px; color: white; z-index: 2100; cursor: pointer; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">PlusUltra</div>
        <input type="text" id="searchInput" class="search-bar" placeholder="Buscar película o serie...">
        <button class="btn-exit" onclick="logout()">Salir</button>
    </header>

    <div id="app">
        <!-- Las filas se generan dinámicamente aquí para no perder categorías -->
    </div>

    <div id="playerOverlay" class="player-overlay">
        <span class="close-player" onclick="closeVideo()">✕</span>
        <video id="mainVideo" controls></video>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        storageBucket: "midata-40f73.firebasestorage.app",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let allMedia = [];

    // Categorías que tenías originalmente
    const categories = [
        { id: 'novedades', title: '🆕 Novedades', filter: (data) => data.slice(-15).reverse() },
        { id: 'peliculas', title: '🍿 Películas', filter: (data) => data.filter(i => i.tipo?.toLowerCase().includes('peli')) },
        { id: 'series', title: '📺 Series', filter: (data) => data.filter(i => i.tipo?.toLowerCase().includes('serie')) },
        { id: 'anime', title: '🍥 Anime', filter: (data) => data.filter(i => i.tipo?.toLowerCase().includes('anime')) }
    ];

    function createCard(item) {
        const card = document.createElement('div');
        card.className = 'card';
        
        // Blindaje contra ERR_CONNECTION_CLOSED
        const imgTag = item.img 
            ? `<img src="${item.img}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=no-img>${item.titulo}</div>'">`
            : `<div class="no-img">${item.titulo}</div>`;

        card.innerHTML = `
            ${imgTag}
            <div class="card-title">${item.titulo}</div>
        `;
        
        card.onclick = () => openVideo(item.url);
        return card;
    }

    function renderApp(data) {
        const container = document.getElementById('app');
        container.innerHTML = '';

        categories.forEach(cat => {
            const filtered = cat.filter(data);
            if (filtered.length > 0) {
                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `<h2>${cat.title}</h2><div class="carousel" id="${cat.id}"></div>`;
                container.appendChild(row);
                
                const carousel = row.querySelector('.carousel');
                filtered.forEach(item => carousel.appendChild(createCard(item)));
            }
        });
    }

    // Buscador en tiempo real
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allMedia.filter(m => m.titulo.toLowerCase().includes(term));
        renderApp(filtered);
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            fetch("https://morning-glade-ac23.rigobertin100.workers.dev")
                .then(r => r.json())
                .then(data => {
                    allMedia = data;
                    renderApp(data);
                });
        } else {
            location.href = 'login.html';
        }
    });

    window.openVideo = (url) => {
        const overlay = document.getElementById('playerOverlay');
        const video = document.getElementById('mainVideo');
        overlay.style.display = 'block';

        if (url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            }
        } else {
            video.src = url;
            video.play();
        }
    };

    window.closeVideo = () => {
        const video = document.getElementById('mainVideo');
        video.pause();
        video.src = "";
        document.getElementById('playerOverlay').style.display = 'none';
    };

    window.logout = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
