<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusUltra Universal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #000; --panel: #121212; --accent: #0a84ff; --card: #1c1c1e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid #2c2c2e; display: flex; flex-direction: column; padding: 25px; }
        .logo { font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 35px; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; }
        .carousel { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; }
        .card { width: 180px; flex-shrink: 0; cursor: pointer; }
        .card-inner { aspect-ratio: 2/3; border-radius: 15px; overflow: hidden; background: var(--card); position: relative; display: flex; align-items: center; justify-content: center; }
        .card img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 2; }
        .card-fallback { color: #555; text-align: center; padding: 10px; font-size: 12px; z-index: 1; }
        .card-title { margin-top: 10px; font-size: 14px; text-align: center; color: #eee; }
        #loader { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="loader">Conectando con R2...</div>

<aside class="sidebar">
    <div class="logo">PlusUltra</div>
    <div style="color: #8e8e93; font-size: 12px; margin-bottom: 20px;">Admin: Juani</div>
    <div class="nav-item">Catálogo</div>
</aside>

<main class="main-content" id="app"></main>

<div id="player" class="player-overlay">
    <span style="position:absolute; top:20px; right:20px; font-size:30px; color:white; cursor:pointer;" onclick="closeVideo()">✕</span>
    <video id="videoElement" controls></video>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const workerURL = "https://morning-glade-ac23.rigobertin100.workers.dev";

    // ESTA FUNCIÓN ES EL FILTRO DE SEGURIDAD
    function cleanURL(rawPath) {
        if (!rawPath) return "";
        // Si el JSON ya trae la URL completa del worker, extraemos solo el nombre del archivo
        let fileName = rawPath.split('/').pop().split('?file=').pop();
        // Devolvemos la URL limpia llamando al worker correctamente
        return `${workerURL}?file=${encodeURIComponent(decodeURIComponent(fileName))}`;
    }

    function createCard(item) {
        const div = document.createElement('div');
        div.className = 'card';
        
        const imgUrl = cleanURL(item.img);
        const videoUrl = cleanURL(item.url);

        div.innerHTML = `
            <div class="card-inner">
                <div class="card-fallback">${item.titulo}</div>
                <img src="${imgUrl}" onerror="this.style.display='none'">
            </div>
            <div class="card-title">${item.titulo}</div>
        `;

        div.onclick = () => openVideo(videoUrl);
        return div;
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            fetch(workerURL)
                .then(r => r.json())
                .then(data => {
                    const main = document.getElementById('app');
                    main.innerHTML = '<h2>Mi Contenido</h2><div class="carousel"></div>';
                    const container = main.querySelector('.carousel');
                    data.forEach(item => container.appendChild(createCard(item)));
                    document.getElementById('loader').style.display = 'none';
                })
                .catch(e => {
                    console.error(e);
                    document.getElementById('loader').innerText = "Error cargando JSON del Worker";
                });
        } else {
            window.location.href = 'login.html';
        }
    });

    window.openVideo = (url) => {
        const p = document.getElementById('player');
        const v = document.getElementById('videoElement');
        p.style.display = 'block';
        v.src = url;
        v.play();
    };

    window.closeVideo = () => {
        document.getElementById('videoElement').pause();
        document.getElementById('player').style.display = 'none';
    };
</script>
</body>
</html>
