<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlusUltra Universal</title>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root { --primary:#0a84ff; --bg:#111; --card-bg:#1c1c1e; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);color:#fff;padding-top:75px;}
.header{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:10px 4%;background:rgba(28,28,30,.9);z-index:9999;}
.logo{font-size:24px;font-weight:900;color:var(--primary);}
.search{padding:8px;border-radius:20px;border:none;background:#222;color:#fff;}
.logout{padding:8px;border:none;border-radius:20px;background:#ff3b30;color:#fff;}
.row{margin-bottom:30px;padding:0 4%;}
.carousel{display:flex;gap:15px;overflow-x:auto;}
.card{width:150px;aspect-ratio:2/3;background:#222;border-radius:12px;overflow:hidden;cursor:pointer;}
.card img{width:100%;height:100%;object-fit:cover;}
.player{position:fixed;inset:0;display:none;background:#000;z-index:100000;}
video{width:100%;height:100%;}
#mainLoader{position:fixed;inset:0;background:#000;display:flex;justify-content:center;align-items:center;z-index:1000000;}
</style>
</head>

<body>

<div id="mainLoader">Cargando...</div>

<header class="header">
<div class="logo" onclick="location.reload()">PlusUltra</div>
<div>
<input id="searchField" class="search" placeholder="Buscar...">
<button class="logout" onclick="logout()">Salir</button>
</div>
</header>

<main id="app"></main>

<div class="player" id="player">
<span style="position:absolute;top:20px;right:20px;font-size:35px;cursor:pointer;" onclick="closeVideo()">✕</span>
<video id="video" controls playsinline></video>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIza...",
authDomain:"midata-40f73.firebaseapp.com",
projectId:"midata-40f73"
});

const auth=getAuth(app);
const db=getFirestore(app);

let allVideos=[];
let currentUser=null;

const videoPlayer={
el:document.getElementById("video"),

async play(v){
this.stop();

let savedTime=0;

try{
if(currentUser){
const snap=await getDoc(doc(db,"users",currentUser.uid,"progress",v.title.replace(/\s+/g,'_')));
if(snap.exists()) savedTime=snap.data().time;
}
}catch(e){console.warn("Firestore error");}

// limpiar eventos
this.el.onloadedmetadata=null;
this.el.onerror=null;
this.el.ontimeupdate=null;

// cargar video
this.el.src=v.video;
this.el.load();

this.el.addEventListener('loadedmetadata',()=>{
this.el.currentTime=savedTime;
this.el.play().catch(()=>{});
},{once:true});

this.el.onerror=()=>alert("Error cargando video");

let last=-1;
this.el.ontimeupdate=()=>{
const sec=Math.floor(this.el.currentTime);
if(currentUser && sec%15===0 && sec!==last){
last=sec;
this.saveProgress(v);
}
};
},

saveProgress(v){
try{
if(currentUser){
setDoc(doc(db,"users",currentUser.uid,"progress",v.title.replace(/\s+/g,'_')),{
time:this.el.currentTime,
duration:this.el.duration,
img:v.img,
last:Date.now()
},{merge:true});
}
}catch(e){}

const local=JSON.parse(localStorage.getItem("progress")||"{}");
local[v.title]={time:this.el.currentTime};
localStorage.setItem("progress",JSON.stringify(local));
},

stop(){
this.el.pause();
this.el.src="";
}
};

function renderCategory(tag,id){
const c=document.getElementById(id);
allVideos.filter(v=>v.category===tag).forEach(v=>{
const d=document.createElement("div");
d.className="card";
d.innerHTML=`<img src="${v.img}">`;
d.onclick=()=>openVideo(v);
c.appendChild(d);
});
}

onAuthStateChanged(auth,user=>{
if(!user){location.href="login.html";return;}

currentUser=user;

fetch("https://snowy-tree-dd6c.rigobertin100.workers.dev")
.then(r=>r.json())
.then(data=>{

if(!data.length){
document.getElementById("mainLoader").innerHTML="Sin contenido";
return;
}

allVideos=data;

document.getElementById("app").innerHTML=`
<div class="row"><div class="carousel" id="movies"></div></div>
<div class="row"><div class="carousel" id="series"></div></div>
<div class="row"><div class="carousel" id="anime"></div></div>
`;

renderCategory("pelicula","movies");
renderCategory("serie","series");
renderCategory("anime","anime");

document.getElementById("mainLoader").style.display="none";
});
});

window.openVideo=v=>{
document.getElementById("player").style.display="block";
videoPlayer.play(v);
};

window.closeVideo=()=>{
videoPlayer.stop();
document.getElementById("player").style.display="none";
};

window.logout=()=>signOut(auth).then(()=>location.reload());

</script>
</body>
</html>
