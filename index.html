<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlusUltra iOS Pro</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:linear-gradient(to bottom,#1c1c1e,#2c2c2e);
color:white;
padding-top:90px;
}

.header{
position:fixed;
top:0;left:0;width:100%;
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 28px;
z-index:9999;
background:rgba(28,28,30,.35);
backdrop-filter:blur(25px);
transition:.3s;
border-bottom:1px solid rgba(255,255,255,.1);
}

.header.scrolled{
background:rgba(28,28,30,.9);
box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.logo{font-size:34px;font-weight:700;color:#0a84ff}

.search{
padding:10px 18px;
border-radius:24px;
border:none;
width:320px;
font-size:16px;
background:rgba(255,255,255,.1);
color:white;
outline:none;
}

.row{margin-top:50px;padding-left:20px}

.carousel{display:flex;gap:18px;overflow-x:auto}

.card{
width:260px;
flex-shrink:0;
aspect-ratio:2/3;
position:relative;
border-radius:24px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.card:hover{transform:scale(1.08)}

.card img{width:100%;height:100%;object-fit:cover}

.player,.series-modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
z-index:999999;
}

.player{background:rgba(0,0,0,.95)}
.series-modal{background:rgba(28,28,30,.95)}

.player-inner,.series-inner{
width:88vw;
height:82vh;
background:#1c1c1e;
border-radius:24px;
overflow:hidden;
position:relative;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

video{width:100%;height:100%;border-radius:24px}

.close{
position:absolute;
top:14px;
right:24px;
font-size:30px;
cursor:pointer;
z-index:20;
}

.player-nav{
position:absolute;
top:14px;
left:24px;
display:flex;
gap:10px;
z-index:20;
}

.player-nav button{
padding:8px 14px;
border:none;
border-radius:10px;
background:#0a84ff;
color:#fff;
cursor:pointer;
font-size:18px;
}

#loginModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
}

#loginBox{
background:#1c1c1e;
padding:40px;
border-radius:24px;
display:flex;
flex-direction:column;
gap:16px;
width:320px;
align-items:center;
}

#loginBox input{
padding:10px 14px;
border-radius:12px;
border:none;
width:100%;
font-size:16px;
}

#loginError{color:#ff453a;display:none}

.logout{
margin-left:10px;
padding:10px 14px;
border:none;
border-radius:12px;
background:#ff3b30;
color:white;
cursor:pointer;
}

/* CONTINUE WATCHING */
.continue-card{position:relative}

.continue-overlay{
position:absolute;
left:0;right:0;bottom:0;
padding:14px;
background:linear-gradient(to top,rgba(0,0,0,.88),transparent);
display:flex;
flex-direction:column;
gap:6px;
}

.continue-info{font-size:14px;font-weight:500}

.continue-line{
height:3px;
border-radius:999px;
background:#0a84ff;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginModal">
<div id="loginBox">
<h2>Iniciar Sesión</h2>
<input id="loginUser" type="email" placeholder="Correo">
<input id="loginPass" type="password" placeholder="Contraseña">
<button id="loginBtn">Ingresar</button>
<p id="loginError">Error</p>
</div>
</div>

<!-- HEADER -->
<div class="header">
<div class="logo">PlusUltra</div>
<div style="display:flex;align-items:center">
<input id="search" class="search" placeholder="Buscar...">
<button class="logout" onclick="logout()">Salir</button>
</div>
</div>

<div id="app"></div>

<!-- PLAYER -->
<div class="player" id="player">
<div class="player-inner">
<span class="close" onclick="closeVideo()">✖</span>

<div class="player-nav" id="playerNav">
<button onclick="prevEpisode()">⏮</button>
<button onclick="nextEpisode()">⏭</button>
</div>

<video id="video" controls></video>
</div>
</div>

<!-- SERIES -->
<div class="series-modal" id="seriesModal">
<div class="series-inner">
<span class="close" onclick="closeSeriesModal()">✖</span>
<h2 id="seriesTitle"></h2>
<select id="seasonSelect"></select>
<div id="episodeList"></div>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE REAL CONFIG */
const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "TU_PROJECT.firebaseapp.com",
projectId: "TU_PROJECT",
storageBucket: "TU_PROJECT.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* DATA */
let allVideos=[];
let currentSeries=null;
let currentSeason=0;
let currentEpisode=0;

/* SAVE PROGRESS */
const KEY="continueWatching";

function getProgress(){
return JSON.parse(localStorage.getItem(KEY)||"{}");
}

function saveProgress(id,time,duration){
const data=getProgress();

data[id]={
time,
duration,
updated:Date.now(),
season:currentSeries?currentSeason:null,
episode:currentSeries?currentEpisode:null
};

localStorage.setItem(KEY,JSON.stringify(data));
}

/* PLAYER */
const player={
video:null,
hls:null,
currentId:null,

init(){
this.video=document.getElementById("video");

let last=0;

this.video.addEventListener("timeupdate",()=>{
const now=Date.now();

if(this.currentId && now-last>5000){
saveProgress(this.currentId,this.video.currentTime,this.video.duration);
last=now;
}
});
},

play(v){
this.cleanup();
this.currentId=v.titulo;

const prog=getProgress()[v.titulo];

if(v.url.includes(".m3u8") && Hls.isSupported()){
this.hls=new Hls();
this.hls.loadSource(v.url);
this.hls.attachMedia(this.video);

this.hls.on(Hls.Events.MANIFEST_PARSED,()=>{
if(prog?.time)this.video.currentTime=prog.time;
this.video.play();
});
}else{
this.video.src=v.url;
this.video.onloadedmetadata=()=>{
if(prog?.time)this.video.currentTime=prog.time;
this.video.play();
};
}
},

cleanup(){
if(this.hls)this.hls.destroy();
this.video.pause();
this.video.removeAttribute("src");
this.video.load();
this.currentId=null;
}
};

function openVideo(v){
document.getElementById("player").style.display="flex";
document.getElementById("playerNav").style.display=currentSeries?"flex":"none";
player.play(v);
}

window.closeVideo=()=>{
player.cleanup();
document.getElementById("player").style.display="none";
};

/* CONTINUE WATCHING */
function renderContinue(){

const data=getProgress();

const list=Object.keys(data)
.map(t=>allVideos.find(v=>v.titulo===t))
.filter(Boolean)
.sort((a,b)=>data[b.titulo].updated-data[a.titulo].updated);

const row=document.getElementById("continueRow");
row.innerHTML="";

list.forEach(v=>{
const prog=data[v.titulo];

if(!prog.duration || prog.time>=prog.duration*0.95) return;

const percent=prog.duration?Math.max(8,(prog.time/prog.duration)*100):0;
const remain=Math.ceil((prog.duration-prog.time)/60);

let info=`Quedan ${remain} min`;

if(v.tipo!=="pelicula"){
info=`T${(prog.season||0)+1}:E${(prog.episode||0)+1} • ${remain} min`;
}

const card=document.createElement("div");
card.className="card continue-card";

card.innerHTML=`
<img src="${v.img}">
<div class="continue-overlay">
<div class="continue-info">${info}</div>
<div class="continue-line" style="width:${percent}%"></div>
</div>
`;

card.onclick=()=>openVideo(v);

row.appendChild(card);
});
}

/* LOGIN */
document.getElementById("loginBtn").onclick=async()=>{
try{
await signInWithEmailAndPassword(
auth,
document.getElementById("loginUser").value,
document.getElementById("loginPass").value
);
}catch(e){
document.getElementById("loginError").style.display="block";
}
};

onAuthStateChanged(auth,user=>{
if(user){
document.getElementById("loginModal").style.display="none";
player.init();

fetch("videos.json")
.then(r=>r.json())
.then(d=>{
allVideos=d;
buildUI();
});
}else{
document.getElementById("loginModal").style.display="flex";
}
});

window.logout=()=>signOut(auth);

</script>
</body>
</html>
