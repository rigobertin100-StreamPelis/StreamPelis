<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlusUltra Universal</title>
    <style>
        :root { --primary: #0a84ff; --bg: #000; --card-bg: #1c1c1e; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; padding-top: 70px; overflow-x: hidden; }
        
        /* Header */
        .header { position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 5%; background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid #333; box-sizing: border-box; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); }
        .logout { padding: 8px 18px; background: #ff3b30; border: none; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }

        /* Filas y Contenedores */
        .row { margin-bottom: 35px; padding: 0 5%; }
        .row h2 { font-size: 20px; margin-bottom: 15px; color: #fff; font-weight: 600; }
        
        .carousel { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .carousel::-webkit-scrollbar { display: none; }
        
        /* Tarjetas */
        .card { width: 165px; flex-shrink: 0; aspect-ratio: 2/3; background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s ease; box-shadow: 0 8px 15px rgba(0,0,0,0.5); }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 100%; object-fit: cover; background: #222; }

        /* Reproductor Fullscreen */
        #player { position: fixed; inset: 0; background: #000; display: none; z-index: 9999; }
        video { width: 100%; height: 100%; }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 40px; color: white; cursor: pointer; z-index: 10000; text-shadow: 0 0 10px rgba(0,0,0,0.7); }
        
        /* Loader Pantalla Completa */
        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5000; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p>Cargando PlusUltra...</p>
</div>

<header class="header">
    <div class="logo">PlusUltra</div>
    <button class="logout" onclick="logout()">Salir</button>
</header>

<main id="app"></main>

<div id="player">
    <span class="close-btn" onclick="closeVideo()">×</span>
    <video id="video" controls playsinline></video>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const WORKER_URL = "https://morning-glade-ac23.rigobertin100.workers.dev";

    let allVideos = [];

    // Función para obtener datos del Worker
    async function loadContent() {
        try {
            console.log("Conectando al Worker...");
            const res = await fetch(WORKER_URL, { cache: 'no-store' });
            
            if (!res.ok) throw new Error("Error en la respuesta del Worker");
            
            allVideos = await res.json();
            console.log("Datos recibidos:", allVideos);

            renderAll();
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            console.error("Error cargando el catálogo:", e);
            document.getElementById('loader').innerHTML = `<p style="color:red">Error de conexión con R2</p>`;
        }
    }

    // Función para pintar el contenido en el HTML
    function renderAll() {
        const appEl = document.getElementById('app');
        
        // Filtramos por el campo 'tipo' que envía tu Worker (pelicula, serie, anime, cine)
        const categories = [
            { title: "🆕 Novedades", data: allVideos.slice(0, 10) },
            { title: "🎬 Películas", data: allVideos.filter(v => v.tipo.toLowerCase().includes('pelicula')) },
            { title: "📺 Series", data: allVideos.filter(v => v.tipo.toLowerCase().includes('serie')) },
            { title: "🍥 Anime", data: allVideos.filter(v => v.tipo.toLowerCase().includes('anime')) },
            { title: "🍿 Cine en Casa", data: allVideos.filter(v => v.tipo.toLowerCase().includes('cine')) }
        ];

        appEl.innerHTML = categories.map(cat => {
            if (cat.data.length === 0) return ''; // No mostrar si está vacía
            return `
                <div class="row">
                    <h2>${cat.title}</h2>
                    <div class="carousel">
                        ${cat.data.map(v => `
                            <div class="card" onclick='openVideo(${JSON.stringify(v)})'>
                                <img src="${v.imagen}" loading="lazy" onerror="this.src='https://placehold.co/200x300/1c1c1e/white?text=Sin+Imagen'">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Funciones globales para el reproductor
    window.openVideo = (v) => {
        const player = document.getElementById('player');
        const video = document.getElementById('video');
        player.style.display = 'block';
        video.src = v.video;
        video.play();
        document.body.style.overflow = 'hidden'; // Evita scroll de fondo
    };

    window.closeVideo = () => {
        const player = document.getElementById('player');
        const video = document.getElementById('video');
        video.pause();
        video.src = "";
        player.style.display = 'none';
        document.body.style.overflow = 'auto';
    };

    // Control de sesión
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loadContent();
        } else {
            window.location.href = "login.html";
        }
    });

    window.logout = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
