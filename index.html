<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlusUltra Pro</title>

    <!-- Meta para WebApp -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/cv/js/cast_sender.js"></script>
    <script src="https://luke-chang.github.io/js-spatial-navigation/spatial_navigation.js"></script>

    <style>
        :root {
            --bg-dark: #1c1c1e;
            --bg-light: #2c2c2e;
            --accent: #0a84ff;
            --focus-glow: #ccff00;
            --danger: #ff3b30;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --header-h: 90px;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(to bottom, var(--bg-dark), var(--bg-light));
            color: var(--text-main);
            padding-top: var(--header-h);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- UI Components --- */
        .header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-h);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px; z-index: 1000;
            background: rgba(28, 28, 30, .35); backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, .1); box-sizing: border-box;
            transition: 0.3s;
        }
        .header.scrolled { background: rgba(28, 28, 30, .9); box-shadow: 0 10px 30px rgba(0,0,0,.5); }

        .logo { font-size: 34px; font-weight: 700; color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 12px; }

        .search {
            padding: 10px 18px; border-radius: 24px; border: none; width: 260px;
            font-size: 16px; background: rgba(255, 255, 255, .1); color: white; outline: none;
        }

        .logout {
            padding: 10px 14px; border: none; border-radius: 12px;
            background: var(--danger); color: #fff; cursor: pointer; font-weight: bold;
        }

        /* --- Hero & Rows --- */
        .hero-banner { position: relative; width: 100%; height: 75vh; background: #000; overflow: hidden; margin-top: calc(var(--header-h) * -1); display: none; }
        .hero-video-bg { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; transform: translate(-50%, -50%); pointer-events: none; }
        .hero-overlay { 
            position: absolute; inset: 0; 
            background: linear-gradient(to right, rgba(28,28,30,0.9) 10%, transparent 70%), linear-gradient(to top, var(--bg-dark) 5%, transparent 50%); 
            display: flex; flex-direction: column; justify-content: center; padding: 0 50px; z-index: 2; 
        }
        #heroTitle { font-size: clamp(30px, 5vw, 60px); margin: 0; text-transform: uppercase; max-width: 50%; line-height: 1.1; }
        .hero-btn { width: fit-content; padding: 14px 35px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 25px; transition: 0.2s; }

        .row { margin-top: 40px; padding-left: 20px; }
        .row h2 { font-size: 22px; margin-bottom: 14px; color: var(--text-dim); }
        .carousel { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 20px; scroll-behavior: smooth; }
        .carousel::-webkit-scrollbar { height: 6px; }
        .carousel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .card { width: 220px; flex-shrink: 0; aspect-ratio: 2/3; position: relative; border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.3s; background: var(--bg-light); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card:focus, .hero-btn:focus, .logout:focus, .season-option:focus {
            outline: 6px solid var(--focus-glow) !important; outline-offset: 3px; transform: scale(1.05); z-index: 100; box-shadow: 0 0 25px rgba(204, 255, 0, 0.7);
        }

        /* --- Modals & Player --- */
        .series-modal, .player { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; z-index: 5000; background: rgba(28,28,30,0.98); backdrop-filter: blur(20px); }
        .player { background: #000; z-index: 9000; }
        .player-inner, .series-inner { width: 92vw; height: 88vh; background: var(--bg-dark); border-radius: 24px; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        video { width: 100%; height: 100%; border-radius: 15px; background: #000; }
        .close { position: absolute; top: 20px; right: 25px; font-size: 30px; cursor: pointer; z-index: 100; }
        
        .player-nav { position: absolute; top: 20px; left: 25px; z-index: 100; display: flex; gap: 10px; transition: 0.3s; }
        .player-nav button, .episode-list button { padding: 10px 16px; border: none; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
        .episode-list { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; overflow-y: auto; }

        /* --- Continuar Viendo --- */
        .continue-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 15px; gap: 8px; }
        .continue-info { font-size: 12px; color: var(--accent); font-weight: bold; }
        .continue-line { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
        .continue-progress { height: 100%; background: var(--accent); }

        .season-option { padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; white-space: nowrap; border: 2px solid transparent; }
        .season-option.active { background: var(--accent); border-color: white; }

        /* --- Login --- */
        #loginModal { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999999; }
        #loginBox { background: var(--bg-dark); padding: 40px; border-radius: 28px; display: flex; flex-direction: column; gap: 16px; width: 320px; }
        #loginBox input { padding: 14px; border-radius: 12px; border: none; background: var(--bg-light); color: white; font-size: 16px; }
        #loginBox button { padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; }

        /* Optimización TV */
        .tv-mode { backdrop-filter: none !important; }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginModal">
    <div id="loginBox">
        <h2 style="text-align:center">PlusUltra</h2>
        <input id="loginUser" type="email" placeholder="Correo" tabindex="1">
        <input id="loginPass" type="password" placeholder="Contraseña" tabindex="2">
        <button id="loginBtn" tabindex="3">Ingresar</button>
        <p id="loginError" style="color:var(--danger); display:none; text-align:center">Credenciales incorrectas</p>
    </div>
</div>

<!-- Header -->
<div class="header">
    <div class="logo">PlusUltra</div>
    <div class="header-right">
        <input id="search" class="search" placeholder="Buscar..." tabindex="0">
        <button id="logoutBtn" class="logout" tabindex="0">Salir</button>
    </div>
</div>

<!-- Hero -->
<div id="heroBanner" class="hero-banner">
    <div id="youtubePlayer" class="hero-video-bg"></div>
    <div class="hero-overlay">
        <h1 id="heroTitle"></h1>
        <p id="heroDesc" style="font-size: 18px; color: var(--text-dim); margin: 10px 0;">Ya disponible en PlusUltra Cine</p>
        <button id="heroPlayBtn" class="hero-btn" tabindex="0">▶ Ver Película</button>
    </div>
</div>

<!-- Main App -->
<div id="app"></div>

<!-- Reproductor -->
<div class="player" id="player">
    <div class="player-inner">
        <span class="close" id="playerClose" tabindex="0">✕</span>
        <div class="player-nav" id="playerNav">
            <button id="btnPlayPause" tabindex="0">⏯</button>
            <button id="btnPrev" tabindex="0">⏮</button>
            <button id="btnRew" tabindex="0">-10s</button>
            <button id="btnFwd" tabindex="0">+10s</button>
            <button id="btnNext" tabindex="0">⏭</button>
            <button id="btnFull" tabindex="0">⛶ Fullscreen</button>
        </div>
        <video id="video" playsinline></video>
    </div>
</div>

<!-- Modal de Series -->
<div class="series-modal" id="seriesModal">
    <div class="series-inner">
        <span class="close" id="seriesClose" tabindex="0">✕</span>
        <h2 id="seriesTitle"></h2>
        <div id="seasonSelect" style="display:flex; gap:10px; overflow-x:auto; width:100%; margin-bottom:10px;"></div>
        <div class="episode-list" id="episodeList"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // --- CONFIGURACIÓN ---
    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        storageBucket: "midata-40f73.firebasestorage.app",
        messagingSenderId: "104287406146",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);
    const STORAGE_KEY = "plus_ultra_progress";

    // --- ESTADO GLOBAL ---
    let state = {
        allVideos: [],
        currentSeries: null,
        currentSeason: 0,
        currentEpisode: 0,
        sessionId: localStorage.getItem("sessionId") || crypto.randomUUID(),
        unsubscribeSession: null,
        loadedCounts: {}
    };
    localStorage.setItem("sessionId", state.sessionId);

    // --- REPRODUCTOR (OBJETO CONTROLADOR) ---
    const playerController = {
        video: null, hls: null, currentId: null, idleTimer: null,
        init() {
            this.video = document.getElementById("video");
            this.video.onerror = () => this.handleError();
            this.video.ontimeupdate = () => this.saveProgress();
            this.video.onended = () => state.currentSeries ? window.nextEpisode() : this.close();
            this.setupControls();
        },
        setupControls() {
            const nav = document.getElementById("playerNav");
            const resetTimer = () => {
                if (document.getElementById("player").style.display !== "flex") return;
                nav.style.opacity = "1";
                document.body.style.cursor = "default";
                clearTimeout(this.idleTimer);
                this.idleTimer = setTimeout(() => {
                    if (!document.activeElement.closest('.player-nav')) {
                        nav.style.opacity = "0";
                        document.body.style.cursor = "none";
                    }
                }, 5000);
            };
            window.addEventListener("mousemove", resetTimer);
            window.addEventListener("keydown", resetTimer);
        },
        play(v) {
            this.cleanup();
            const isSerie = state.currentSeries && (state.currentSeries.tipo === "serie" || state.currentSeries.tipo === "anime");
            document.getElementById("btnPrev").style.display = isSerie ? "inline-block" : "none";
            document.getElementById("btnNext").style.display = isSerie ? "inline-block" : "none";

            this.currentId = state.currentSeries ? state.currentSeries.titulo : v.titulo;
            const saved = this.getProgressData()[this.currentId];

            const startVideo = () => {
                if (saved && (!state.currentSeries || (saved.season === state.currentSeason && saved.episode === state.currentEpisode))) {
                    this.video.currentTime = saved.time;
                }
                this.video.play().catch(() => console.log("Autoplay blocked"));
            };

            if (v.url.includes(".m3u8") && Hls.isSupported()) {
                this.hls = new Hls({ capLevelToPlayerSize: true });
                this.hls.loadSource(v.url);
                this.hls.attachMedia(this.video);
                this.hls.on(Hls.Events.MANIFEST_PARSED, startVideo);
            } else {
                this.video.src = v.url;
                this.video.onloadedmetadata = startVideo;
            }
        },
        saveProgress() {
            if (this.currentId && this.video.currentTime > 5) {
                const data = this.getProgressData();
                data[this.currentId] = {
                    time: this.video.currentTime,
                    duration: this.video.duration,
                    updated: Date.now(),
                    season: state.currentSeries ? state.currentSeason : null,
                    episode: state.currentSeries ? state.currentEpisode : null
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }
        },
        getProgressData() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); },
        cleanup() {
            if (this.hls) { this.hls.destroy(); this.hls = null; }
            this.video.pause();
            this.video.removeAttribute('src');
            this.video.load();
        },
        handleError() {
            this.close();
            alert("Error al reproducir el video.");
        },
        close() {
            this.cleanup();
            document.getElementById("player").style.display = "none";
            if (state.currentSeries) {
                document.getElementById("seriesModal").style.display = "flex";
                uiManager.switchFocus('modal');
            } else {
                uiManager.switchFocus('main');
            }
            uiManager.renderContinue();
        }
    };

    // --- UI MANAGER ---
    const uiManager = {
        init() {
            this.setupListeners();
            this.detectDevice();
        },
        detectDevice() {
            const ua = navigator.userAgent.toLowerCase();
            const isTV = /smart-tv|tizen|webos|hisense|apple-tv|googletv|firetv|roku/i.test(ua);
            if (isTV) document.body.classList.add("tv-mode");
        },
        setupListeners() {
            document.getElementById("logoutBtn").onclick = () => this.logout();
            document.getElementById("playerClose").onclick = () => playerController.close();
            document.getElementById("seriesClose").onclick = () => this.closeSeriesModal();
            document.getElementById("btnPlayPause").onclick = () => this.togglePlay();
            document.getElementById("btnRew").onclick = () => document.getElementById('video').currentTime -= 10;
            document.getElementById("btnFwd").onclick = () => document.getElementById('video').currentTime += 10;
            document.getElementById("btnFull").onclick = () => this.toggleFullScreen();
            
            // Search logic
            const sInput = document.getElementById("search");
            sInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    this.handleSearch(e.target.value);
                    e.target.blur();
                }
            });
            sInput.addEventListener("input", (e) => { if (!e.target.value.trim()) this.handleSearch(""); });
        },
        buildUI() {
            document.getElementById("app").innerHTML = `
                <div class="row" id="recentRowContainer"><h2>🆕 Recién agregadas</h2><div class="carousel" id="recentRow"></div></div>
                <div class="row" id="contHeader"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
                <div class="row"><h2>🍿 Cine</h2><div class="carousel" id="cineRow"></div></div>
                <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
                <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
                <div class="row"><h2>🍥 Anime</h2><div class="carousel" id="animeRow"></div></div>`;
            this.renderAll();
            this.setupHeroBanner();
            this.initTV();
        },
        renderAll() {
            const map = [
                { id: "recentRow", data: [...state.allVideos].slice(-30).reverse() },
                { id: "peliculasRow", data: state.allVideos.filter(v => v.tipo === "pelicula").reverse() },
                { id: "seriesRow", data: state.allVideos.filter(v => v.tipo === "serie").reverse() },
                { id: "cineRow", data: state.allVideos.filter(v => v.tipo === "cine").reverse() },
                { id: "animeRow", data: state.allVideos.filter(v => v.tipo === "anime").reverse() }
            ];
            map.forEach(sec => this.renderSection(sec.id, sec.data));
            this.renderContinue();
        },
        renderSection(id, data) {
            const container = document.getElementById(id);
            if (!container) return;
            container.innerHTML = "";
            state.loadedCounts[id] = 0;
            
            const load = () => {
                const start = state.loadedCounts[id];
                const segment = data.slice(start, start + 10);
                segment.forEach(v => container.appendChild(this.createCard(v)));
                state.loadedCounts[id] += 10;
                if (window.SpatialNavigation) SpatialNavigation.makeFocusable();
            };

            load();
            const sentinel = document.createElement("div");
            sentinel.className = "loading-sentinel";
            sentinel.innerText = "•••";
            container.appendChild(sentinel);

            new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && state.loadedCounts[id] < data.length) load();
            }, { root: container }).observe(sentinel);
        },
        createCard(v) {
            const card = document.createElement("div");
            card.className = "card";
            card.tabIndex = 0;
            card.innerHTML = `<img src="${v.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=Sin+Imagen'">`;
            card.onclick = () => (v.tipo === "serie" || v.tipo === "anime") ? this.openSeriesModal(v) : this.openVideo(v);
            return card;
        },
        renderContinue() {
            const data = playerController.getProgressData();
            const row = document.getElementById("continueRow");
            const header = document.getElementById("contHeader");
            if (!row) return;

            const list = Object.keys(data).map(id => {
                const base = state.allVideos.find(v => v.titulo.trim() === id.trim());
                return base ? { ...base, _prog: data[id] } : null;
            }).filter(v => v && v._prog.time > 5 && v._prog.time < v._prog.duration * 0.95)
              .sort((a, b) => b._prog.updated - a._prog.updated);

            header.style.display = list.length ? "block" : "none";
            row.innerHTML = "";
            list.slice(0, 8).forEach(v => {
                const card = this.createCard(v);
                const pct = (v._prog.time / v._prog.duration) * 100;
                card.innerHTML += `<div class="continue-overlay"><div class="continue-line"><div class="continue-progress" style="width:${pct}%"></div></div></div>`;
                card.onclick = () => {
                    if (v.tipo === "serie" || v.tipo === "anime") {
                        state.currentSeries = v; state.currentSeason = v._prog.season || 0; state.currentEpisode = v._prog.episode || 0;
                        this.openVideo(v.temporadas[state.currentSeason].episodios[state.currentEpisode]);
                    } else {
                        this.openVideo(v);
                    }
                };
                row.appendChild(card);
            });
        },
        openVideo(v) {
            document.getElementById("seriesModal").style.display = "none";
            document.getElementById("player").style.display = "flex";
            playerController.play(v);
            this.switchFocus('player');
        },
        openSeriesModal(series) {
            state.currentSeries = series;
            state.currentSeason = 0;
            const modal = document.getElementById("seriesModal");
            modal.style.display = "flex";
            document.getElementById("seriesTitle").innerText = series.titulo;
            
            const box = document.getElementById("seasonSelect");
            box.innerHTML = "";
            series.temporadas?.forEach((t, i) => {
                const opt = document.createElement("div");
                opt.className = `season-option ${i === 0 ? 'active' : ''}`;
                opt.innerText = `T${t.numero}`;
                opt.tabIndex = 0;
                opt.onclick = () => {
                    state.currentSeason = i;
                    document.querySelectorAll(".season-option").forEach(el => el.classList.remove("active"));
                    opt.classList.add("active");
                    this.renderEpisodes(i);
                };
                box.appendChild(opt);
            });
            this.renderEpisodes(0);
            this.switchFocus('modal');
        },
        renderEpisodes(idx) {
            const list = document.getElementById("episodeList");
            list.innerHTML = "";
            state.currentSeries.temporadas[idx].episodios.forEach((ep, i) => {
                const btn = document.createElement("button");
                btn.innerText = ep.titulo;
                btn.tabIndex = 0;
                btn.onclick = () => { state.currentEpisode = i; this.openVideo(ep); };
                list.appendChild(btn);
            });
            SpatialNavigation.makeFocusable();
        },
        closeSeriesModal() {
            document.getElementById("seriesModal").style.display = "none";
            state.currentSeries = null;
            this.switchFocus('main');
        },
        handleSearch(q) {
            const clean = q.toLowerCase().trim();
            const hero = document.getElementById("heroBanner");
            if (!clean) {
                this.buildUI();
                hero.style.display = "block";
                return;
            }
            hero.style.display = "none";
            const filtered = state.allVideos.filter(v => v.titulo.toLowerCase().includes(clean));
            document.querySelectorAll(".row").forEach(r => r.style.display = "none");
            
            const resCont = document.getElementById("recentRowContainer");
            const resRow = document.getElementById("recentRow");
            resCont.style.display = "block";
            resCont.querySelector("h2").innerText = `Resultados: ${q}`;
            resRow.innerHTML = filtered.length ? "" : "<p>No hay resultados</p>";
            filtered.forEach(v => resRow.appendChild(this.createCard(v)));
            SpatialNavigation.makeFocusable();
        },
        async setupHeroBanner() {
            const cine = state.allVideos.filter(v => v.tipo === "cine");
            if (!cine.length) return;
            const peli = cine[Math.floor(Math.random() * Math.min(5, cine.length))];
            const banner = document.getElementById("heroBanner");
            banner.style.display = "block";
            document.getElementById("heroTitle").innerText = peli.titulo;
            document.getElementById("heroPlayBtn").onclick = () => this.openVideo(peli);
            
            const ytId = await this.getYoutubeId(peli);
            const src = ytId ? `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${ytId}` : "";
            if (ytId) document.getElementById("youtubePlayer").innerHTML = `<iframe width="100%" height="100%" src="${src}" frameborder="0" allow="autoplay"></iframe>`;
        },
        async getYoutubeId(peli) {
            try {
                const txtUrl = peli.img.substring(0, peli.img.lastIndexOf('.')) + ".txt";
                const res = await fetch(txtUrl);
                if (res.ok) return (await res.text()).trim();
            } catch {}
            return null;
        },
        initTV() {
            if (!window.SpatialNavigation) return;
            SpatialNavigation.init();
            SpatialNavigation.add({ id: 'main', selector: '.card, .hero-btn, .logout, .search' });
            SpatialNavigation.add({ id: 'modal', selector: '.season-option, .episode-list button, .series-modal .close' });
            SpatialNavigation.add({ id: 'player', selector: '.player-nav button, .player .close' });
            this.switchFocus('main');
        },
        switchFocus(group) {
            ['main', 'modal', 'player'].forEach(g => SpatialNavigation.disable(g));
            SpatialNavigation.enable(group);
            SpatialNavigation.focus(group);
        },
        togglePlay() {
            const v = document.getElementById("video");
            v.paused ? v.play() : v.pause();
        },
        toggleFullScreen() {
            const v = document.getElementById("video");
            if (v.requestFullscreen) v.requestFullscreen();
            else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
        },
        logout() {
            if (state.unsubscribeSession) state.unsubscribeSession();
            signOut(auth).then(() => location.reload());
        }
    };

    // --- ACCIONES GLOBALES (PARA EL REPRODUCTOR) ---
    window.nextEpisode = () => {
        const s = state.currentSeries;
        if (!s) return;
        if (state.currentEpisode < s.temporadas[state.currentSeason].episodios.length - 1) {
            state.currentEpisode++;
            uiManager.openVideo(s.temporadas[state.currentSeason].episodios[state.currentEpisode]);
        } else if (state.currentSeason < s.temporadas.length - 1) {
            state.currentSeason++; state.currentEpisode = 0;
            uiManager.openVideo(s.temporadas[state.currentSeason].episodios[state.currentEpisode]);
        } else {
            playerController.close();
        }
    };

    window.prevEpisode = () => {
        const s = state.currentSeries;
        if (!s) return;
        if (state.currentEpisode > 0) {
            state.currentEpisode--;
            uiManager.openVideo(s.temporadas[state.currentSeason].episodios[state.currentEpisode]);
        }
    };

    // --- FIREBASE & SESSION ---
    async function setupSession(user) {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        let sessions = snap.exists() ? snap.data().sessions || [] : [];
        sessions = sessions.filter(s => s.id !== state.sessionId);
        sessions.push({ id: state.sessionId, lastSeen: Date.now() });
        if (sessions.length > 2) sessions = sessions.slice(-2);
        await setDoc(userRef, { sessions }, { merge: true });

        state.unsubscribeSession = onSnapshot(userRef, (docSnap) => {
            const stillValid = docSnap.data()?.sessions?.some(s => s.id === state.sessionId);
            if (!stillValid) uiManager.logout();
        });
    }

    // --- INIT ---
    document.getElementById("loginBtn").onclick = async () => {
        try {
            await signInWithEmailAndPassword(auth, document.getElementById("loginUser").value, document.getElementById("loginPass").value);
        } catch {
            document.getElementById("loginError").style.display = "block";
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById("loginModal").style.display = "none";
            uiManager.init();
            playerController.init();
            setupSession(user);
            
            const cache = localStorage.getItem('plusultra_catalog_cache');
            if (cache) { state.allVideos = JSON.parse(cache); uiManager.buildUI(); }
            
            try {
                const res = await fetch("https://odd-credit-e6f8.rigobertin100.workers.dev/");
                state.allVideos = await res.json();
                localStorage.setItem('plusultra_catalog_cache', JSON.stringify(state.allVideos));
                uiManager.buildUI();
            } catch (e) { console.error("Data load failed", e); }
        } else {
            document.getElementById("loginModal").style.display = "flex";
        }
    });

</script>
