<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusUltra iOS Pro</title>

    <!-- CONFIGURACIÓN PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PlusUltra">
    <link rel="apple-touch-icon" href="https://i.ibb.co/3S7vX2P/logo-512.png">
    <meta name="theme-color" content="#1c1c1e">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/cv/js/cast_sender.js"></script>
    <script>
    window.castAvailable = false;
    window['__onGCastApiAvailable'] = function(isAvailable) {
      if (isAvailable && window.cast && window.chrome) {
        window.castAvailable = true;
        const btn = document.getElementById("castBtn");
        if (btn) btn.style.display = "inline-block";
      }
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("PlusUltra PWA Ready"))
        .catch((err) => console.log("SW Error", err));
    }
    </script>

    <style>
        /* --- ESTILOS EXISTENTES MANTENIDOS --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            background: linear-gradient(to bottom, #111, #000);
            color: white;
            padding-top: 90px;
            overflow-x: hidden;
        }

        #mainLoader {
            position: fixed;
            inset: 0;
            background: #1c1c1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000000;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #0a84ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            z-index: 9999;
            background: rgba(28, 28, 30, .4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: .3s;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }

        .logo { font-size: 30px; font-weight: 800; color: #0a84ff; flex-shrink: 0; letter-spacing: -1px; }
        .header-right { display: flex; align-items: center; gap: 15px; flex-grow: 1; justify-content: flex-end; }

        .search {
            padding: 12px 20px;
            border-radius: 14px;
            border: none;
            width: 100%;
            max-width: 300px;
            font-size: 16px;
            background: rgba(255, 255, 255, .08);
            color: white;
            outline: none;
            transition: .3s;
        }
        .search:focus { background: rgba(255, 255, 255, .15); max-width: 400px; border: 1px solid #0a84ff; }

        .logout {
            padding: 12px 18px;
            border: none;
            border-radius: 14px;
            background: #ff3b30;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: .2s;
        }

        .row { margin-top: 40px; padding-left: 25px; padding-bottom: 10px; }
        .row h2 { font-size: 22px; font-weight: 700; margin-bottom: 15px; color: rgba(255,255,255,0.9); }
        
        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .card {
            width: 220px;
            flex-shrink: 0;
            aspect-ratio: 2/3;
            background: #2c2c2e;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: scale(1.05); }
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0; 
            transition: opacity 0.6s ease; 
        }

        /* --- PLAYER & MODALS --- */
        .player, .series-modal { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; z-index: 999999; background: rgba(0,0,0,.98); }
        .player-inner, .series-inner { width: 95vw; height: 90vh; background: #1c1c1e; border-radius: 30px; position: relative; display: flex; flex-direction: column; align-items: center; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        video { width: 100%; height: 100%; border-radius: 20px; background: #000; }
        .close { position: absolute; top: 20px; right: 30px; font-size: 35px; cursor: pointer; color: white; z-index: 20; opacity: 0.6; }
        
        /* Login */
        #loginModal { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 999999; }
        #loginBox { background: #1c1c1e; padding: 40px; border-radius: 30px; display: flex; flex-direction: column; gap: 20px; width: 350px; align-items: center; }
        #loginBox input { padding: 15px; border-radius: 14px; border: none; width: 100%; background: #2c2c2e; color: white; }
        #loginBox button { padding: 15px; border: none; border-radius: 14px; background: #0a84ff; color: #fff; font-weight: bold; width: 100%; }

        /* Continue Watching */
        .continue-card .continue-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .continue-line { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2); overflow: hidden; }
        .continue-progress { height: 100%; background: #0a84ff; }
        
        .episode-list { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; overflow-y: auto; }
        .episode-list button { padding: 12px; border: none; border-radius: 10px; background: #3a3a3c; color: #fff; cursor: pointer; }
    </style>
</head>

<body>

<div id="mainLoader">
    <div class="spinner"></div>
    <div id="loaderStatus">Cargando catálogo...</div>
</div>

<div id="loginModal">
    <div id="loginBox">
        <h2 style="color:#0a84ff">PlusUltra</h2>
        <input id="loginUser" type="email" placeholder="Correo">
        <input id="loginPass" type="password" placeholder="Contraseña">
        <button id="loginBtn">Ingresar</button>
        <p id="loginError" style="color:#ff3b30; display:none; font-size:14px;"></p>
    </div>
</div>

<div class="header">
    <div class="logo">PlusUltra</div>
    <div class="header-right">
        <input id="searchField" class="search" placeholder="Buscar películas o series...">
        <button class="logout" onclick="logout()">Salir</button>
    </div>
</div>

<div id="app"></div>

<!-- CONTENEDOR PARA RESULTADOS DE BÚSQUEDA -->
<div id="searchResults" class="row" style="display:none;">
    <h2>Resultados de búsqueda</h2>
    <div class="carousel" id="searchRow"></div>
</div>

<div class="player" id="player">
    <div class="player-inner">
        <span class="close" onclick="closeVideo()">✖</span>
        <video id="video" controls controlsList="nodownload"></video>
    </div>
</div>

<div class="series-modal" id="seriesModal">
    <div class="series-inner">
        <span class="close" onclick="closeSeriesModal()">✖</span>
        <h2 id="seriesTitle"></h2>
        <div id="seasonSelect" style="display:flex; gap:10px; margin-bottom:15px;"></div>
        <div class="episode-list" id="episodeList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
    authDomain: "midata-40f73.firebaseapp.com",
    projectId: "midata-40f73",
    storageBucket: "midata-40f73.firebasestorage.app",
    messagingSenderId: "104287406146",
    appId: "1:104287406146:web:d9fad446e22629559dc5db"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let allVideos = [];
let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
localStorage.setItem("sessionId", sessionId);

// --- LAZY LOADING OBSERVER ---
const lazyLoadInstance = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.onload = () => img.style.opacity = "1";
            observer.unobserve(img);
        }
    });
}, { rootMargin: "200px" });

// --- PLAYER CONTROLLER ---
const playerController = {
    video: null, hls: null, currentId: null,
    init() {
        this.video = document.getElementById("video");
        this.video.addEventListener("timeupdate", () => {
            if(this.currentId) saveProgress(this.currentId, this.video.currentTime, this.video.duration);
        });
    },
    play(v) {
        this.cleanup();
        this.currentId = v.titulo;
        if(v.url.includes(".m3u8") && Hls.isSupported()){
            this.hls = new Hls();
            this.hls.loadSource(v.url);
            this.hls.attachMedia(this.video);
            this.hls.on(Hls.Events.MANIFEST_PARSED, () => this.video.play());
        } else {
            this.video.src = v.url;
            this.video.play();
        }
    },
    cleanup() {
        if(this.hls) { this.hls.destroy(); this.hls = null; }
        this.video.pause();
        this.video.src = "";
    }
};

// --- RENDERIZADO OPTIMIZADO ---
function renderRow(list, id) {
    const row = document.getElementById(id);
    if (!row) return;
    row.innerHTML = "";
    list.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";
        // Lazy loading activo: usamos data-src
        card.innerHTML = `<img class="lazy" data-src="${v.img}" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">`;
        card.onclick = () => v.tipo === "serie" || v.tipo === "anime" ? openSeriesModal(v) : openVideo(v);
        row.appendChild(card);
        lazyLoadInstance.observe(card.querySelector('img'));
    });
}

// --- BUSCADOR ---
document.getElementById("searchField").oninput = (e) => {
    const query = e.target.value.toLowerCase();
    const resultsArea = document.getElementById("searchResults");
    const appArea = document.getElementById("app");

    if (query.length > 2) {
        const filtered = allVideos.filter(v => v.titulo.toLowerCase().includes(query));
        appArea.style.display = "none";
        resultsArea.style.display = "block";
        renderRow(filtered, "searchRow");
    } else {
        appArea.style.display = "block";
        resultsArea.style.display = "none";
    }
};

// --- LOGICA DE APP ---
function buildUI() {
    document.getElementById("app").innerHTML = `
        <div class="row"><h2>🆕 Recientes</h2><div class="carousel" id="recentRow"></div></div>
        <div class="row"><h2>🍿 Cine</h2><div class="carousel" id="cineRow"></div></div>
        <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
        <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
    `;
    renderRow([...allVideos].reverse().slice(0, 10), "recentRow");
    renderRow(allVideos.filter(v => v.tipo === "cine"), "cineRow");
    renderRow(allVideos.filter(v => v.tipo === "pelicula"), "peliculasRow");
    renderRow(allVideos.filter(v => v.tipo === "serie"), "seriesRow");

    const loader = document.getElementById("mainLoader");
    loader.style.opacity = "0";
    setTimeout(() => loader.style.display = "none", 500);
}

// --- SESIÓN Y AUTH ---
onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("loginModal").style.display = "none";
        playerController.init();
        fetch("https://small-king-30c8.rigobertin100.workers.dev")
            .then(r => r.json())
            .then(data => {
                allVideos = data;
                buildUI();
            });
    } else {
        document.getElementById("loginModal").style.display = "flex";
        document.getElementById("mainLoader").style.display = "none";
    }
});

// Botón de login
document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value;
    try { await signInWithEmailAndPassword(auth, email, pass); }
    catch (e) { document.getElementById("loginError").innerText = "Error de acceso"; document.getElementById("loginError").style.display = "block"; }
};

// Funciones globales para botones onclick
window.logout = () => signOut(auth);
window.closeVideo = () => { playerController.cleanup(); document.getElementById("player").style.display = "none"; };
window.openVideo = (v) => { document.getElementById("player").style.display = "flex"; playerController.play(v); };

</script>
</body>
</html>
