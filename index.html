<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlusUltra Universal</title>
    <style>
        :root { --primary: #0a84ff; --bg: #000; --card-bg: #1c1c1e; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: white; padding-top: 80px; }
        
        .header { position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 5%; background: rgba(20,20,20,0.9); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid #333; box-sizing: border-box; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); }
        .logout { padding: 8px 16px; background: #ff3b30; border: none; border-radius: 20px; color: white; cursor: pointer; font-weight: bold; }

        .row { margin-bottom: 40px; padding: 0 5%; }
        .row h2 { font-size: 22px; margin-bottom: 15px; }
        
        .carousel { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
        
        .card { width: 170px; flex-shrink: 0; aspect-ratio: 2/3; background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        #player { position: fixed; inset: 0; background: #000; display: none; z-index: 9999; }
        video { width: 100%; height: 100%; }
        .close-btn { position: absolute; top: 25px; right: 25px; font-size: 40px; color: white; cursor: pointer; z-index: 10000; }
        
        #loader { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 5000; font-weight: bold; }
    </style>
</head>
<body>

<div id="loader">Sincronizando con R2...</div>

<header class="header">
    <div class="logo">PlusUltra</div>
    <button class="logout" onclick="logout()">Salir</button>
</header>

<main id="app"></main>

<div id="player">
    <span class="close-btn" onclick="closeVideo()">×</span>
    <video id="video" controls playsinline></video>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const WORKER_URL = "https://morning-glade-ac23.rigobertin100.workers.dev";

    let allVideos = [];

    async function loadContent() {
        try {
            const res = await fetch(WORKER_URL);
            if (!res.ok) throw new Error("Worker no responde");
            
            allVideos = await res.json();
            console.log("Datos cargados correctamente:", allVideos);
            
            renderAll();
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            console.error("Error en index:", e);
            document.getElementById('loader').innerText = "Error cargando catálogo. Revisa la consola.";
        }
    }

    function renderAll() {
        const appEl = document.getElementById('app');
        
        // Categorías basadas en el campo 'tipo' de tu Worker
        const sections = [
            { title: "🆕 Novedades", data: allVideos.slice(0, 10) },
            { title: "🎬 Películas", data: allVideos.filter(v => v.tipo === 'pelicula') },
            { title: "📺 Series", data: allVideos.filter(v => v.tipo === 'serie') },
            { title: "🍥 Anime", data: allVideos.filter(v => v.tipo === 'anime') }
        ];

        appEl.innerHTML = sections.map(sec => {
            if (sec.data.length === 0) return ''; // Saltamos si no hay datos
            return `
                <div class="row">
                    <h2>${sec.title}</h2>
                    <div class="carousel">
                        ${sec.data.map(v => `
                            <div class="card" onclick='openVideo(${JSON.stringify(v)})'>
                                <img src="${v.imagen}" onerror="this.src='https://via.placeholder.com/200x300?text=Error+Img'">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.openVideo = (v) => {
        const player = document.getElementById('player');
        const video = document.getElementById('video');
        player.style.display = 'block';
        video.src = v.video;
        video.play();
    };

    window.closeVideo = () => {
        const video = document.getElementById('video');
        video.pause();
        video.src = "";
        document.getElementById('player').style.display = 'none';
    };

    onAuthStateChanged(auth, (user) => {
        if (user) { loadContent(); } 
        else { window.location.href = "login.html"; }
    });

    window.logout = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
