<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusUltra Universal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #000; --panel: #121212; --accent: #0a84ff; --card: #1c1c1e; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { margin: 0; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar estilo Apple */
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid #2c2c2e; display: flex; flex-direction: column; padding: 20px; }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        
        .search-container { position: relative; margin-bottom: 25px; }
        .search-input { width: 100%; background: #2c2c2e; border: none; border-radius: 10px; padding: 10px 15px; color: white; font-size: 14px; }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; cursor: pointer; color: #8e8e93; transition: 0.2s; margin-bottom: 5px; }
        .nav-item:hover, .nav-item.active { background: #2c2c2e; color: white; }
        .btn-exit { margin-top: auto; background: #ff3b30; border: none; border-radius: 10px; padding: 12px; color: white; font-weight: 600; cursor: pointer; }

        /* Contenido Principal */
        .main-content { flex: 1; overflow-y: auto; padding: 40px; }
        .row { margin-bottom: 40px; }
        .row h2 { font-size: 22px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .carousel { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; }
        .carousel::-webkit-scrollbar { height: 4px; }
        .carousel::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Cards Recuperadas */
        .card { width: 180px; flex-shrink: 0; cursor: pointer; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: scale(1.04); }
        .card-inner { position: relative; aspect-ratio: 2/3; border-radius: 15px; overflow: hidden; background: var(--card); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { margin-top: 10px; font-size: 14px; font-weight: 500; text-align: center; color: #efeff4; }

        /* Player Overlay */
        .player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        .close-btn { position: absolute; top: 30px; right: 30px; font-size: 30px; cursor: pointer; z-index: 2100; }
        video { width: 100%; height: 100%; }

        /* Loader */
        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 20px; color: #8e8e93;">Cargando PlusUltra...</p>
</div>

<aside class="sidebar">
    <div class="logo">PlusUltra</div>
    <div class="search-container">
        <input type="text" id="searchBox" class="search-input" placeholder="Buscar película...">
    </div>
    <div class="nav-item active"><span>🆕</span> Novedades</div>
    <div class="nav-item"><span>🎬</span> Películas</div>
    <div class="nav-item"><span>📺</span> Series</div>
    <div class="nav-item"><span>🍥</span> Anime</div>
    <button class="btn-exit" onclick="logout()">Cerrar Sesión</button>
</aside>

<main class="main-content" id="app">
    <!-- Aquí se inyectan las categorías -->
</main>

<div id="player" class="player-overlay">
    <span class="close-btn" onclick="closeVideo()">✕</span>
    <video id="videoElement" controls></video>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        storageBucket: "midata-40f73.firebasestorage.app",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let masterData = [];

    function createCard(item) {
        const div = document.createElement('div');
        div.className = 'card';
        // SOLUCIÓN AL ERROR DE CONEXIÓN: Si falla la imagen, no reintenta ni carga basura externa
        const imgHtml = item.img 
            ? `<img src="${item.img}" loading="lazy" onerror="this.style.display='none'; this.nextSibling.style.display='flex'">`
            : `<div style="display:none"></div>`;

        div.innerHTML = `
            <div class="card-inner">
                ${imgHtml}
                <div style="display:none; height:100%; width:100%; align-items:center; justify-content:center; padding:15px; text-align:center; font-size:12px; color:#555; background:#1c1c1e;">${item.titulo}</div>
            </div>
            <div class="card-title">${item.titulo}</div>
        `;
        div.onclick = () => openVideo(item.url);
        return div;
    }

    function buildUI(data) {
        const main = document.getElementById('app');
        main.innerHTML = '';

        const sections = [
            { t: '🆕 Novedades', f: d => d.slice(-12).reverse() },
            { t: '🎬 Películas', f: d => d.filter(x => x.tipo?.toLowerCase().includes('peli')) },
            { t: '📺 Series', f: d => d.filter(x => x.tipo?.toLowerCase().includes('serie')) },
            { t: '🍥 Anime', f: d => d.filter(x => x.tipo?.toLowerCase().includes('anime')) }
        ];

        sections.forEach(sec => {
            const items = sec.f(data);
            if(items.length > 0) {
                const row = document.createElement('section');
                row.className = 'row';
                row.innerHTML = `<h2>${sec.t}</h2><div class="carousel"></div>`;
                const carousel = row.querySelector('.carousel');
                items.forEach(i => carousel.appendChild(createCard(i)));
                main.appendChild(row);
            }
        });
    }

    // Buscador interactivo
    document.getElementById('searchBox').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = masterData.filter(m => m.titulo.toLowerCase().includes(query));
        buildUI(filtered);
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            fetch("https://morning-glade-ac23.rigobertin100.workers.dev")
                .then(r => r.json())
                .then(data => {
                    masterData = data;
                    buildUI(data);
                    document.getElementById('loader').style.display = 'none';
                });
        } else {
            location.href = 'login.html';
        }
    });

    window.openVideo = (url) => {
        const p = document.getElementById('player');
        const v = document.getElementById('videoElement');
        p.style.display = 'block';
        if(url.includes('.m3u8')) {
            if(Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(v);
                hls.on(Hls.Events.MANIFEST_PARSED, () => v.play());
            }
        } else {
            v.src = url;
            v.play();
        }
    };

    window.closeVideo = () => {
        const v = document.getElementById('videoElement');
        v.pause(); v.src = "";
        document.getElementById('player').style.display = 'none';
    };

    window.logout = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
