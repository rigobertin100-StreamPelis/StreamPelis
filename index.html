<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
    authDomain: "midata-40f73.firebaseapp.com",
    projectId: "midata-40f73",
    storageBucket: "midata-40f73.firebasestorage.app",
    messagingSenderId: "104287406146",
    appId: "1:104287406146:web:d9fad446e22629559dc5db"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
localStorage.setItem("sessionId", sessionId);

let allVideos = [];
let currentSeries = null;
let currentSeason = 0;
let currentEpisode = 0;
let unsubscribeSession = null;

const SEGMENT_SIZE = 10;
const loadedCounts = {};

// --- DETECCIÓN DE DISPOSITIVO ---
function getDeviceType() {
    const ua = navigator.userAgent.toLowerCase();
    if (/smart-tv|tizen|webos|hisense|apple-tv|googletv|firetv|roku|hbbtv|viera|netcast/i.test(ua)) {
        return "PANTALLA";
    }
    if (/android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua)) {
        return "CELULAR";
    }
    return "PC";
}

const DISPOSITIVO = getDeviceType();
console.log("Iniciando PlusUltra Pro en:", DISPOSITIVO);

document.body.classList.add("mode-" + DISPOSITIVO.toLowerCase());

function initTVNavigation() {
    if (window.SpatialNavigation) {
        SpatialNavigation.init();
        SpatialNavigation.add({ id: 'main', selector: '.card, .hero-btn, .logout, .search, #loginBtn, #loginBox input' });
        SpatialNavigation.add({ id: 'modal', selector: '.series-modal .season-option, .series-modal .episode-list button, .series-modal .close' });
        SpatialNavigation.add({ id: 'player', selector: '.player .player-nav button, .player .close' });
        SpatialNavigation.makeFocusable();
        
        window.addEventListener('sn:focused', (e) => {
            if (e.target.classList.contains('card')) {
                e.target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        });

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.id === "search") return;
            const playerOpen = document.getElementById("player").style.display === "flex";
            const modalOpen = document.getElementById("seriesModal").style.display === "flex";
            const isFullScreen = !!(document.fullscreenElement || document.webkitFullscreenElement);

            if([37, 38, 39, 40, 13].includes(e.keyCode)) {
                if(playerOpen || modalOpen) e.preventDefault();
            }

            if (e.keyCode === 13 && document.activeElement.id !== "search") { 
                const active = document.activeElement; 
                if (active && typeof active.click === 'function') {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    active.click(); 
                }
            }
            
            if ([27, 8, 461, 10009].includes(e.keyCode)) {
                e.preventDefault();
                e.stopImmediatePropagation();
                if (isFullScreen) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else if (playerOpen) {
                    window.closeVideo();
                } else if (modalOpen) {
                    window.closeSeriesModal();
                }
            }
        }, true);
    }
}

// Mejora: Escuchador global para botón atrás físico (Navegadores/Android TV)
window.addEventListener('popstate', function(event) {
    if (document.getElementById("player").style.display === "flex") {
        window.closeVideo();
    } else if (document.getElementById("seriesModal").style.display === "flex") {
        window.closeSeriesModal();
    }
});

window.switchFocusGroup = (groupId) => {
    if (window.SpatialNavigation) {
        SpatialNavigation.disable('main'); 
        SpatialNavigation.disable('modal'); 
        SpatialNavigation.disable('player');
        SpatialNavigation.enable(groupId); 
        setTimeout(() => { SpatialNavigation.focus(groupId); }, 100);
    }
}

window.toggleFullScreen = () => {
    const video = document.getElementById("video");
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
};

function applyTVOptimizations() {
    const ua = navigator.userAgent.toLowerCase();
    const isTV = /smart-tv|tizen|webos|hisense|apple-tv|googletv/.test(ua);
    if (isTV) document.body.classList.add("tv-mode");
}

async function setupSessionSecurity(user) {
    if (unsubscribeSession) unsubscribeSession();
    const userRef = doc(db, "users", user.uid);
    
    const snap = await getDoc(userRef);
    let sessions = snap.exists() ? snap.data().sessions || [] : [];
    sessions = sessions.filter(s => s.id !== sessionId);
    sessions.push({ id: sessionId, lastSeen: Date.now() });
    if (sessions.length > 2) sessions = sessions.slice(-2);
    await setDoc(userRef, { sessions }, { merge: true });

    unsubscribeSession = onSnapshot(userRef, (docSnap) => {
        const data = docSnap.data();
        const stillValid = data?.sessions?.some(s => s.id === sessionId);
        if (!stillValid) {
            logout();
        }
    });
}

const STORAGE_KEY="plus_ultra_progress";
const getProgress = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

const playerController = {
    video: null, hls: null, currentId: null, idleTimer: null,
    init(){
        this.video = document.getElementById("video");
        
        this.video.onerror = () => {
            console.error("Error en reproducción");
            window.closeVideo();
            alert("El video no puede reproducirse o el enlace ha caducado.");
        };

        this.video.ontimeupdate = () => {
            if(this.currentId && this.video.currentTime > 5) {
                const data = getProgress();
                data[this.currentId] = { 
                    time: this.video.currentTime, 
                    duration: this.video.duration, 
                    updated: Date.now(), 
                    season: currentSeries ? currentSeason : null, 
                    episode: currentSeries ? currentEpisode : null 
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }
        };
        this.video.onended = () => currentSeries ? window.nextEpisode() : window.closeVideo();
        
        const nav = document.getElementById("playerNav");
        const resetTimer = () => {
            if (document.getElementById("player").style.display !== "flex") return;
            nav.style.opacity = "1";
            document.body.style.cursor = "default"; 

            clearTimeout(this.idleTimer);
            this.idleTimer = setTimeout(() => {
                if (!document.activeElement.closest('.player-nav')) { 
                    nav.style.opacity = "0";
                    document.body.style.cursor = "none"; 
                }
            }, 5000);
        };
        
        window.addEventListener("mousemove", resetTimer);
        window.addEventListener("keydown", resetTimer);
    },
    play(v){
        this.cleanup();
        const isSerie = currentSeries && (currentSeries.tipo === "serie" || currentSeries.tipo === "anime");
        document.getElementById("btnPrev").style.display = isSerie ? "inline-block" : "none";
        document.getElementById("btnNext").style.display = isSerie ? "inline-block" : "none";

        this.currentId = currentSeries ? currentSeries.titulo : v.titulo;
        const saved = getProgress()[this.currentId];

        const startVideo = () => {
            if(saved && (!currentSeries || (saved.season === currentSeason && saved.episode === currentEpisode))) {
                this.video.currentTime = saved.time;
            }
            this.video.play().catch(e => console.log("Autoplay bloqueado"));
        };

        if(v.url.includes(".m3u8") && Hls.isSupported()){
            this.hls = new Hls({ capLevelToPlayerSize: true }); 
            this.hls.loadSource(v.url); 
            this.hls.attachMedia(this.video);
            this.hls.on(Hls.Events.MANIFEST_PARSED, startVideo);
        } else {
            this.video.src = v.url;
            this.video.onloadedmetadata = startVideo;
        }
    },
    cleanup(){ 
        if(this.hls) { this.hls.destroy(); this.hls = null; } 
        this.video.pause(); 
        this.video.removeAttribute('src'); 
        this.video.load(); 
    }
};

window.openVideo = (v) => {
    document.getElementById("seriesModal").style.display = "none";
    document.getElementById("player").style.display = "flex";
    
    // Mejora: Guardar estado en historial para botón atrás físico
    history.pushState({ action: "close_video" }, "");
    
    playerController.play(v); 
    window.switchFocusGroup('player');
};

window.togglePlay = () => {
    const v = document.getElementById("video");
    if (v.paused) v.play(); else v.pause();
};

window.closeVideo = () => {
    playerController.cleanup(); 
    document.getElementById("player").style.display = "none";
    document.body.style.cursor = "default"; // Recuperar cursor al cerrar
    
    if (currentSeries) { 
        document.getElementById("seriesModal").style.display = "flex"; 
        window.switchFocusGroup('modal'); 
    } else { 
        window.switchFocusGroup('main'); 
    }
    renderContinue(5);
};

window.openSeriesModal = (series) => {
    currentSeries = series; 
    currentSeason = 0;
    document.getElementById("seriesModal").style.display = "flex";
    document.getElementById("seriesTitle").innerText = series.titulo;
    
    // Mejora: Historial para cerrar modal con botón atrás físico
    history.pushState({ action: "close_modal" }, "");

    const box = document.getElementById("seasonSelect"); 
    box.innerHTML = "";
    if(!series.temporadas || series.temporadas.length === 0) { 
        document.getElementById("episodeList").innerHTML = "Próximamente..."; 
        return; 
    }
    series.temporadas.forEach((t, i) => {
        const opt = document.createElement("div"); 
        opt.className = `season-option ${i === currentSeason ? 'active' : ''}`; 
        opt.innerText = t.numero; 
        opt.tabIndex = 0;
        opt.onclick = (e) => { 
            e.preventDefault();
            currentSeason = i; 
            document.querySelectorAll(".season-option").forEach(el => el.classList.remove("active")); 
            opt.classList.add("active"); 
            renderEpisodes(i); 
        };
        box.appendChild(opt);
    });
    renderEpisodes(currentSeason); 
    window.switchFocusGroup('modal');
};

function renderEpisodes(idx) {
    const list = document.getElementById("episodeList"); 
    list.innerHTML = "";
    currentSeries.temporadas[idx].episodios.forEach((ep, i) => {
        const btn = document.createElement("button"); 
        btn.innerText = ep.titulo; 
        btn.tabIndex = 0;
        btn.onclick = (e) => { 
            e.preventDefault();
            currentEpisode = i; 
            window.openVideo(ep); 
        };
        list.appendChild(btn);
    });
    if (window.SpatialNavigation) SpatialNavigation.makeFocusable();
}

window.nextEpisode = () => {
    if (!currentSeries) return;
    const temporadaActual = currentSeries.temporadas[currentSeason];
    if (currentEpisode < temporadaActual.episodios.length - 1) { 
        currentEpisode++; 
        window.openVideo(temporadaActual.episodios[currentEpisode]); 
    } else if (currentSeason < currentSeries.temporadas.length - 1) { 
        currentSeason++; 
        currentEpisode = 0; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    } else {
        window.closeVideo();
    }
};

window.prevEpisode = () => {
    if (!currentSeries) return;
    if (currentEpisode > 0) { 
        currentEpisode--; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    } else if (currentSeason > 0) { 
        currentSeason--; 
        currentEpisode = currentSeries.temporadas[currentSeason].episodios.length - 1; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    }
};

window.closeSeriesModal = () => { 
    document.getElementById("seriesModal").style.display = "none"; 
    currentSeries = null; 
    window.switchFocusGroup('main'); 
};

async function setupHeroBanner() {
    const cinePelis = allVideos.filter(v => v.tipo === "cine"); 
    if (cinePelis.length === 0) return;
    
    const ultimas5 = cinePelis.slice(-5);
    const ultimaPeli = ultimas5[Math.floor(Math.random() * ultimas5.length)];
    document.getElementById("heroBanner").style.display = "block";
    document.getElementById("heroTitle").innerText = ultimaPeli.titulo;
    document.getElementById("heroPlayBtn").onclick = () => { currentSeries = null; window.openVideo(ultimaPeli); };
    
    const txtUrl = ultimaPeli.img.substring(0, ultimaPeli.img.lastIndexOf('.')) + ".txt";
    let manualVideoId = null; 
    try { 
        const response = await fetch(txtUrl); 
        if (response.ok) manualVideoId = (await response.text()).trim(); 
    } catch (e) {}

    let finalSrc = (manualVideoId && manualVideoId.length < 15)
        ? `https://www.youtube-nocookie.com/embed/${manualVideoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${manualVideoId}&rel=0&modestbranding=1`
        : `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(ultimaPeli.titulo + " trailer oficial")}&autoplay=1&mute=1&controls=0&modestbranding=1`;
    
    document.getElementById("youtubePlayer").innerHTML = `<iframe width="100%" height="100%" src="${finalSrc}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
}

function buildUI(){
    document.getElementById("app").innerHTML = `
        <div class="row"><h2>🆕 Recién agregadas</h2><div class="carousel" id="recentRow"></div></div>
        <div class="row" id="contHeader"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
        <div class="row"><h2>🍿 Cine</h2><div class="carousel" id="cineRow"></div></div>
        <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
        <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
        <div class="row"><h2>🍥 Anime</h2><div class="carousel" id="animeRow"></div></div>`;
    renderAll(); setupHeroBanner(); initTVNavigation(); window.switchFocusGroup('main');
}

function renderAll(){
    const sections = [ { id: "recentRow", data: [...allVideos].slice(-30).reverse() }, { id: "peliculasRow", data: allVideos.filter(v => v.tipo === "pelicula").reverse() }, { id: "seriesRow", data: allVideos.filter(v => v.tipo === "serie").reverse() }, { id: "cineRow", data: allVideos.filter(v => v.tipo === "cine").reverse() }, { id: "animeRow", data: allVideos.filter(v => v.tipo === "anime").reverse() } ];
    sections.forEach(section => {
        const container = document.getElementById(section.id); if(!container) return;
        container.innerHTML = ""; loadedCounts[section.id] = 0; loadNextSegment(section.id, section.data);
        const sentinel = document.createElement("div"); sentinel.className = "loading-sentinel"; sentinel.innerText = "•••"; container.appendChild(sentinel);
        new IntersectionObserver((entries) => { if (entries[0].isIntersecting) loadNextSegment(section.id, section.data); }, { root: container, threshold: 0.1 }).observe(sentinel);
    });
    renderContinue(5);
}

function loadNextSegment(containerId, sourceData) {
    const container = document.getElementById(containerId); const sentinel = container.querySelector(".loading-sentinel");
    const start = loadedCounts[containerId]; const segment = sourceData.slice(start, start + SEGMENT_SIZE);
    segment.forEach(v => { const card = createCard(v); sentinel ? container.insertBefore(card, sentinel) : container.appendChild(card); });
    loadedCounts[containerId] = start + SEGMENT_SIZE;
    if (loadedCounts[containerId] >= sourceData.length && sentinel) sentinel.style.display = "none";
    if (window.SpatialNavigation) SpatialNavigation.makeFocusable();
}

function createCard(v){
    const card = document.createElement("div"); card.className = "card"; card.tabIndex = 0; card.dataset.title = v.titulo.toLowerCase();
    
    // Mejora: Imagen de respaldo si falla el link original
    card.innerHTML = `<img src="${v.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=Sin+Imagen'">`;
    
    card.onclick = (e) => { e.preventDefault(); (v.tipo === "serie" || v.tipo === "anime") ? window.openSeriesModal(v) : window.openVideo(v); };
    return card;
}

function renderContinue(limite = 5) {
    const data = getProgress(); const row = document.getElementById("continueRow"); const container = document.getElementById("contHeader"); if (!row || !container) return;
    row.innerHTML = "";
    let list = Object.keys(data).map(id => { const base = allVideos.find(v => v.titulo.trim() === id.trim()); return base ? { ...base, _prog: data[id] } : null; }).filter(v => v && v._prog.time > 5 && v._prog.time < v._prog.duration * 0.95);
    list.sort((a, b) => b._prog.updated - a._prog.updated);
    const finalDisplay = list.slice(0, limite); container.style.display = finalDisplay.length === 0 ? "none" : "block";
    finalDisplay.forEach(v => {
        const p = v._prog; const pct = (p.time / p.duration) * 100;
        let infoTexto = (v.tipo === "serie" || v.tipo === "anime") ? `T${(p.season || 0) + 1}:E${(p.episode || 0) + 1} • ${Math.ceil((p.duration - p.time)/60)} min` : `Faltan ${Math.ceil((p.duration - p.time)/60)} min`;
        const card = createCard(v); card.innerHTML += `<div class="continue-overlay"><div class="continue-info">${infoTexto}</div><div class="continue-line"><div class="continue-progress" style="width:${pct}%"></div></div></div>`;
        card.onclick = (e) => { 
            e.preventDefault();
            if (v.tipo === "serie" || v.tipo === "anime") { currentSeries = v; currentSeason = p.season || 0; currentEpisode = p.episode || 0; window.openVideo(v.temporadas[currentSeason].episodios[currentEpisode]); } else { currentSeries = null; window.openVideo(v); } 
        };
        row.appendChild(card);
    });
}

function handleSearch(query) {
    const cleanQuery = query.toLowerCase().trim();
    if (cleanQuery === "") {
        renderAll();
        return;
    }
    const filtered = allVideos.filter(v => v.titulo.toLowerCase().includes(cleanQuery));
    const container = document.getElementById("recentRow");
    document.querySelectorAll('.row').forEach(r => r.style.display = 'none');
    container.parentElement.style.display = 'block';
    container.parentElement.querySelector('h2').innerText = `Resultados: ${query}`;
    container.innerHTML = "";
    filtered.forEach(v => container.appendChild(createCard(v)));
    if (window.SpatialNavigation) SpatialNavigation.makeFocusable();
}

const searchInput = document.getElementById("search");

searchInput.addEventListener("keydown", (e) => {
    e.stopImmediatePropagation();
    if (e.key === "Backspace") return;
    if (e.key === "Enter") {
        e.preventDefault();
        handleSearch(e.target.value);
        e.target.blur(); 
    }
}, true);

searchInput.addEventListener("focus", () => {
    if (window.SpatialNavigation) SpatialNavigation.pause();
});

searchInput.addEventListener("blur", () => {
    if (window.SpatialNavigation) SpatialNavigation.resume();
});

document.getElementById("loginBtn").onclick = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById("loginUser").value, document.getElementById("loginPass").value); } catch(e) { document.getElementById("loginError").style.display = "block"; } };

onAuthStateChanged(auth, async (user) => {
    if(user){
        document.getElementById("loginModal").style.display = "none"; 
        applyTVOptimizations(); 
        playerController.init(); 
        setupSessionSecurity(user);
        const cacheKey = 'plusultra_catalog_cache'; 
        const cachedData = localStorage.getItem(cacheKey);
        if (cachedData) { allVideos = JSON.parse(cachedData); buildUI(); }
        try { 
            const r = await fetch("https://odd-credit-e6f8.rigobertin100.workers.dev/"); 
            const data = await r.json(); 
            allVideos = data; 
            localStorage.setItem(cacheKey, JSON.stringify(data)); 
            buildUI(); 
        } catch (e) {}
    } else { 
        document.getElementById("loginModal").style.display = "flex"; 
        initTVNavigation(); 
    }
});

window.logout = () => {
    if (unsubscribeSession) unsubscribeSession();
    signOut(auth).then(() => location.reload());
};
</script>
