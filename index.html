<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusUltra iOS Pro</title>

    <!-- CONFIGURACIÓN PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PlusUltra">
    <link rel="apple-touch-icon" href="https://i.ibb.co/3S7vX2P/logo-512.png">
    <meta name="theme-color" content="#1c1c1e">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/cv/js/cast_sender.js"></script>
    <script>
    window.castAvailable = false;
    window['__onGCastApiAvailable'] = function(isAvailable) {
      if (isAvailable && window.cast && window.chrome) {
        window.castAvailable = true;
        const btn = document.getElementById("castBtn");
        if (btn) btn.style.display = "inline-block";
      }
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("PlusUltra PWA Ready"))
        .catch((err) => console.log("SW Error", err));
    }
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            background: linear-gradient(to bottom, #1c1c1e, #111);
            color: white;
            padding-top: 90px;
            overflow-x: hidden;
        }

        /* --- LOADER DE CARGA --- */
        #mainLoader {
            position: fixed;
            inset: 0;
            background: #1c1c1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000000;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #0a84ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            z-index: 9999;
            background: rgba(28, 28, 30, .4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: .3s;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }

        @media (min-width: 1200px) {
            .logo { font-size: 42px !important; }
            .row h2 { font-size: 32px !important; }
            .card { width: 320px !important; }
        }

        .header.scrolled { background: rgba(20, 20, 20, .95); padding: 10px 25px; }
        .logo { font-size: 30px; font-weight: 800; color: #0a84ff; flex-shrink: 0; letter-spacing: -1px; }

        .header-right { display: flex; align-items: center; gap: 15px; flex-grow: 1; justify-content: flex-end; }

        .search {
            padding: 12px 20px;
            border-radius: 14px;
            border: none;
            width: 100%;
            max-width: 300px;
            min-width: 120px;
            font-size: 16px;
            background: rgba(255, 255, 255, .08);
            color: white;
            outline: none;
            transition: .3s;
        }
        .search:focus { background: rgba(255, 255, 255, .15); max-width: 400px; }

        .logout {
            white-space: nowrap;
            padding: 12px 18px;
            border: none;
            border-radius: 14px;
            background: #ff3b30;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
            transition: .2s;
        }

        .row { margin-top: 40px; padding-left: 25px; padding-bottom: 10px; }
        .row h2 { font-size: 24px; font-weight: 700; margin-bottom: 18px; color: rgba(255,255,255,0.9); }
        
        .carousel {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 25px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .card {
            width: 260px;
            flex-shrink: 0;
            aspect-ratio: 2/3;
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .card:hover { transform: scale(1.05); z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        
        .player, .series-modal { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; z-index: 999999; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .player { background: rgba(0,0,0,.98); }
        .series-modal { background: rgba(15,15,15,.98); backdrop-filter: blur(20px); }
        .player-inner, .series-inner { width: 95vw; height: 90vh; background: #1c1c1e; border-radius: 30px; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        video { width: 100%; height: 100%; border-radius: 20px; background: #000; }
        .close { position: absolute; top: 20px; right: 30px; font-size: 35px; cursor: pointer; color: white; z-index: 20; opacity: 0.6; }
        
        #loginModal { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 999999; }
        #loginBox { background: #1c1c1e; padding: 40px; border-radius: 30px; display: flex; flex-direction: column; gap: 20px; width: 350px; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #loginBox input { padding: 15px; border-radius: 14px; border: none; width: 100%; font-size: 16px; background: #2c2c2e; color: white; }
        #loginBox button { padding: 15px; border: none; border-radius: 14px; background: #0a84ff; color: #fff; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        #loginError { color: #ff3b30; display: none; font-size: 14px; text-align: center; }

        .continue-card .continue-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; gap: 8px; }
        .continue-line { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2); overflow: hidden; }
        .continue-progress { height: 100%; background: #0a84ff; border-radius: 999px; }
        
        .season-option { padding: 10px 16px; background: rgba(255,255,255,.05); border-radius: 12px; cursor: pointer; white-space: nowrap; transition: .2s; }
        .season-option.active { background: #0a84ff; transform: scale(1.05); }
        .episode-list { width: 100%; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 25px; overflow-y: auto; }
        .episode-list button { padding: 12px 20px; border: none; border-radius: 14px; background: #0a84ff; color: #fff; cursor: pointer; font-weight: bold; }
    </style>
</head>

<body>

<!-- PANTALLA DE CARGA INICIAL -->
<div id="mainLoader">
    <div class="spinner"></div>
    <div id="loaderStatus">Cargando catálogo...</div>
</div>

<div id="loginModal">
    <div id="loginBox">
        <h2>PlusUltra</h2>
        <input id="loginUser" type="email" placeholder="Correo">
        <input id="loginPass" type="password" placeholder="Contraseña">
        <button id="loginBtn">Ingresar</button>
        <p id="loginError"></p>
    </div>
</div>

<div class="header">
    <div class="logo">PlusUltra</div>
    <div class="header-right">
        <input id="search" class="search" placeholder="Buscar...">
        <button class="logout" onclick="logout()">Salir</button>
    </div>
</div>

<div id="app"></div>

<div class="player" id="player">
    <div class="player-inner">
        <span class="close" onclick="closeVideo()">✖</span>
        <div class="player-nav" id="playerNav">
            <button onclick="prevEpisode()">⏮</button>
            <button onclick="nextEpisode()">⏭</button>
            <button id="castBtn" onclick="castVideo()" style="display:none;">📺 Cast</button>
        </div>
        <video id="video" controls controlsList="nodownload"></video>
    </div>
</div>

<div class="series-modal" id="seriesModal">
    <div class="series-inner">
        <span class="close" onclick="closeSeriesModal()">✖</span>
        <h2 id="seriesTitle"></h2>
        <div id="seasonSelect" class="season-select" style="display:flex; gap:10px; margin-bottom:15px;"></div>
        <div class="episode-list" id="episodeList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
    authDomain: "midata-40f73.firebaseapp.com",
    projectId: "midata-40f73",
    storageBucket: "midata-40f73.firebasestorage.app",
    messagingSenderId: "104287406146",
    appId: "1:104287406146:web:d9fad446e22629559dc5db"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
localStorage.setItem("sessionId", sessionId);

let allVideos = [];
let currentSeries = null;
let currentSeason = 0;
let currentEpisode = 0;
let sessionInterval = null;

// --- UTILIDADES ---
function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

async function registerSession(user) {
    try {
        const ref = doc(db, "users", user.uid);
        const snap = await getDoc(ref);
        let sessions = snap.exists() ? snap.data().sessions || [] : [];
        const now = Date.now();
        sessions = sessions.filter(s => s.id !== sessionId);
        sessions.push({ id: sessionId, lastSeen: now });
        if (sessions.length > 2) sessions = sessions.slice(-2);
        await setDoc(ref, { sessions }, { merge: true });
    } catch (e) { console.error("Error de sesión:", e); }
}

async function validateSession(user) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) return false;
    const sessions = snap.data().sessions || [];
    return sessions.some(s => s.id === sessionId);
}

function startSessionWatcher(user) {
    if(sessionInterval) clearInterval(sessionInterval);
    sessionInterval = setInterval(async () => {
        const valid = await validateSession(user);
        if (!valid) {
            clearInterval(sessionInterval);
            alert("Tu cuenta se abrió en otro dispositivo");
            await signOut(auth);
            location.reload();
        }
    }, 15000);
}

const STORAGE_KEY="continueWatching";
function getProgress(){ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"); }
function saveProgress(id,time,duration){
    const data=getProgress();
    data[id]={ time, duration, updated:Date.now(), season:currentSeries ? currentSeason : null, episode:currentSeries ? currentEpisode : null };
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

const playerController = {
    video:null, hls:null, currentId:null,
    init(){
        this.video = document.getElementById("video");
        this.video.addEventListener("timeupdate", () => {
            if(this.currentId) saveProgress(this.currentId, this.video.currentTime, this.video.duration);
        });
        this.video.addEventListener("ended", () => {
            if(currentSeries) nextEpisode(); else closeVideo();
        });
    },
    play(v){
        this.cleanup();
        this.currentId = currentSeries ? `${currentSeries.titulo}-S${currentSeason}-E${currentEpisode}` : v.titulo;
        const progress = getProgress()[this.currentId];

        if(v.url.includes(".m3u8") && Hls.isSupported()){
            this.hls = new Hls();
            this.hls.loadSource(v.url);
            this.hls.attachMedia(this.video);
            this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if(progress?.time) this.video.currentTime = progress.time;
                this.video.play();
            });
        } else {
            this.video.src = v.url;
            this.video.onloadedmetadata = () => {
                if(progress?.time) this.video.currentTime = progress.time;
                this.video.play();
            };
        }
    },
    cleanup(){
        if(this.hls){ this.hls.destroy(); this.hls = null; }
        this.video.pause();
        this.video.removeAttribute("src");
        this.video.load();
    }
};

window.openVideo = function(v){
    document.getElementById("seriesModal").style.display="none";
    document.getElementById("player").style.display="flex";
    document.getElementById("playerNav").style.display= currentSeries ? "flex" : "none";
    playerController.play(v);
}

window.closeVideo=function(){
    playerController.cleanup();
    document.getElementById("player").style.display="none";
    if(currentSeries) document.getElementById("seriesModal").style.display="flex";
};

window.openSeriesModal = function(series){
    currentSeries=series;
    document.getElementById("seriesModal").style.display="flex";
    document.getElementById("seriesTitle").innerText=series.titulo;
    const seasonBox = document.getElementById("seasonSelect");
    seasonBox.innerHTML = "Cargando temporadas...";

    fetch(series.temporadasUrl).then(r=>r.json()).then(data=>{
        currentSeries.temporadas=data;
        seasonBox.innerHTML = "";
        data.forEach((t, i) => {
            const btn = document.createElement("div");
            btn.className = "season-option " + (i === currentSeason ? "active" : "");
            btn.innerText = "T" + t.numero;
            btn.onclick = () => {
                currentSeason = i;
                document.querySelectorAll(".season-option").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderEpisodes(i);
            };
            seasonBox.appendChild(btn);
        });
        renderEpisodes(currentSeason);
    });
}

function renderEpisodes(index){
    const list=document.getElementById("episodeList");
    list.innerHTML="";
    currentSeries.temporadas[index].episodios.forEach((ep,i)=>{
        const btn=document.createElement("button");
        btn.innerText=ep.titulo;
        btn.onclick=()=>{ currentEpisode=i; openVideo(ep); };
        list.appendChild(btn);
    });
}

window.nextEpisode=function(){
    const season=currentSeries.temporadas[currentSeason];
    if(currentEpisode < season.episodios.length-1){
        currentEpisode++; openVideo(season.episodios[currentEpisode]);
    } else if(currentSeason < currentSeries.temporadas.length-1){
        currentSeason++; currentEpisode=0; openVideo(currentSeries.temporadas[currentSeason].episodios[0]);
    }
};

window.prevEpisode=function(){
    if(currentEpisode > 0){
        currentEpisode--; openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]);
    }
};

window.closeSeriesModal=function(){
    document.getElementById("seriesModal").style.display="none";
    currentSeries=null; currentSeason=0; currentEpisode=0;
};

function buildUI(){
    document.getElementById("app").innerHTML=`
    <div class="row"><h2>🆕 Agregadas recientemente</h2><div class="carousel" id="recentRow"></div></div>
    <div class="row"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
    <div class="row"><h2>🍿 Del Cine a tu Casa</h2><div class="carousel" id="cineRow"></div></div>
    <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
    <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
    <div class="row"><h2>🍥 Anime</h2><div class="carousel" id="animeRow"></div></div>`;
    
    const cats = [{t:"cine",id:"cineRow"},{t:"pelicula",id:"peliculasRow"},{t:"serie",id:"seriesRow"},{t:"anime",id:"animeRow"}];
    renderRow([...allVideos].reverse().slice(0,12), "recentRow");
    renderContinue();
    cats.forEach(c => {
        const list = allVideos.filter(v => v.tipo === c.t);
        renderRow(shuffle(list), c.id);
    });

    // OCULTAR LOADER CUANDO LA UI ESTÁ LISTA
    const loader = document.getElementById("mainLoader");
    loader.style.opacity = "0";
    setTimeout(() => loader.style.display = "none", 500);
}

function renderRow(list, id) {
    const row = document.getElementById(id);
    if (!row) return;
    row.innerHTML = "";
    list.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<img src="${v.img}" loading="lazy">`;
        card.onclick = () => v.tipo === "serie" || v.tipo === "anime" ? openSeriesModal(v) : openVideo(v);
        row.appendChild(card);
    });
}

function renderContinue(){
    const data = getProgress();
    const row = document.getElementById("continueRow");
    if(!row) return;
    Object.keys(data).forEach(id => {
        const title = id.includes("-S") ? id.split("-S")[0] : id;
        const v = allVideos.find(x => x.titulo === title);
        if(v) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<img src="${v.img}"><div class="continue-overlay"><div class="continue-line"><div class="continue-progress" style="width:${(data[id].time/data[id].duration)*100}%"></div></div></div>`;
            card.onclick = () => openVideo(v);
            row.appendChild(card);
        }
    });
}

onAuthStateChanged(auth, async (user)=>{
    if(user){
        document.getElementById("loginModal").style.display="none";
        await registerSession(user);
        startSessionWatcher(user);
        playerController.init();
        
        // --- FETCH CON LOADER Y CATCH SEGURO ---
        fetch("https://small-king-30c8.rigobertin100.workers.dev")
            .then(r => {
                if(!r.ok) throw new Error("Error en servidor");
                return r.json();
            })
            .then(data => {
                allVideos = data;
                buildUI();
            })
            .catch(err => {
                document.getElementById("loaderStatus").innerText = "Error cargando el catálogo. Reintenta más tarde.";
                console.error(err);
            });
    } else {
        document.getElementById("loginModal").style.display="flex";
        document.getElementById("mainLoader").style.display="none";
    }
});

document.getElementById("loginBtn").onclick=async()=>{
    const email=document.getElementById("loginUser").value;
    const pass=document.getElementById("loginPass").value;
    try { await signInWithEmailAndPassword(auth,email,pass); }
    catch(e) { 
        const err = document.getElementById("loginError");
        err.innerText = "Credenciales incorrectas";
        err.style.display = "block";
    }
};

window.logout = () => signOut(auth);
</script>
</body>
</html>
