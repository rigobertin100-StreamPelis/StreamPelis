<script type="module">

const getSignedCache = () => JSON.parse(sessionStorage.getItem("plusultra_signed_links") || "{}");
const setSignedCache = (key, url) => {
    const cache = getSignedCache();
    cache[key] = { url, timestamp: Date.now() };

window.setExperience = (type) => {
    localStorage.setItem("user_experience", type);
    document.getElementById("expModal").style.display = "none";
    location.reload();
};

function initExperience() {
    const exp = localStorage.getItem("user_experience");
    if (!exp) {
        document.getElementById("expModal").style.display = "flex";
        if (window.SpatialNavigation) {
            SpatialNavigation.init();
            SpatialNavigation.add({ id: 'exp', selector: '#expBox button' });
            SpatialNavigation.makeFocusable();
            SpatialNavigation.focus('exp');
        }
        return false;
    }
    if (exp === 'tv') {
        document.body.classList.add("tv-mode");
        initTVNavigation();
    }
    return true;
}

function initTVNavigation() {
    if (window.SpatialNavigation) {
        SpatialNavigation.init();
        SpatialNavigation.add({ id: 'main', selector: '.card, .hero-btn, .logout, .search, .btn-catalog, #loginBtn, #loginBox input' });
        SpatialNavigation.add({ id: 'modal', selector: '.series-modal .season-option, .series-modal .episode-list button, .series-modal .close, #modalPlayBtn' });
        SpatialNavigation.add({ id: 'player', selector: '.player .player-nav button, .player .close' });
        SpatialNavigation.makeFocusable();
    }
}

window.addEventListener('keydown', (e) => {
    const playerOpen = document.getElementById("player").style.display === "flex";
    const modalOpen = document.getElementById("seriesModal").style.display === "flex";
    const isFullScreen = !!(document.fullscreenElement || document.webkitFullscreenElement);

    if ([27, 8, 461, 10009].includes(e.keyCode)) {
        if (isFullScreen) {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            e.preventDefault();
        } else if (playerOpen) {
            e.preventDefault(); window.closeVideo();
        } else if (modalOpen) {
            e.preventDefault(); window.closeSeriesModal();
        }
    }
    if (e.keyCode === 13) { 
        const active = document.activeElement; 
        if (active && active.tagName !== 'INPUT' && typeof active.click === 'function') {
            e.preventDefault(); active.click(); 
        }
    }
}, true);

window.switchFocusGroup = (groupId) => {
    if (localStorage.getItem("user_experience") !== 'tv') return;
    if (window.SpatialNavigation) {
        SpatialNavigation.disable('main'); SpatialNavigation.disable('modal'); SpatialNavigation.disable('player');
        SpatialNavigation.enable(groupId); 
        setTimeout(() => { SpatialNavigation.focus(groupId); }, 100);
    }
}

window.toggleFullScreen = () => {
    const video = document.getElementById("video");
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
};

const STORAGE_KEY="plus_ultra_progress";
const getProgress = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

const playerController = {
    video: null, hls: null, currentId: null, idleTimer: null,
    init(){
        this.video = document.getElementById("video");
        this.video.ontimeupdate = () => {
            if(this.currentId && this.video.currentTime > 5) {
                const data = getProgress();
                data[this.currentId] = { 
                    time: this.video.currentTime, duration: this.video.duration, 
                    updated: Date.now(), season: currentSeries ? currentSeason : null, 
                    episode: currentSeries ? currentEpisode : null 
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }
        };
        this.video.onended = () => currentSeries ? window.nextEpisode() : window.closeVideo();
        
        const nav = document.getElementById("playerNav");
        const resetTimer = () => {
            if (document.getElementById("player").style.display !== "flex") return;
            nav.style.opacity = "1";
            clearTimeout(this.idleTimer);
            this.idleTimer = setTimeout(() => { 
                if(!document.activeElement.closest('.player-nav')) nav.style.opacity = "0";
            }, 5000);
        };
        window.addEventListener("mousemove", resetTimer);
        window.addEventListener("keydown", resetTimer);
    },
    async play(v){
        this.cleanup();
        const isSerie = currentSeries && (currentSeries.tipo === "serie" || currentSeries.tipo === "anime");
        document.getElementById("btnPrev").style.display = isSerie ? "inline-block" : "none";
        document.getElementById("btnNext").style.display = isSerie ? "inline-block" : "none";

        this.currentId = currentSeries ? currentSeries.titulo : v.titulo;
        const saved = getProgress()[this.currentId];

        const startVideo = () => {
            if(saved && (!currentSeries || (saved.season === currentSeason && saved.episode === currentEpisode))) {
                this.video.currentTime = saved.time;
            }
            this.video.play().catch(e => console.warn("Autoplay bloqueado", e));
        };

        if(v.url.includes(".m3u8") && Hls.isSupported()){
            this.hls = new Hls(); this.hls.loadSource(v.url); this.hls.attachMedia(this.video);
            this.hls.on(Hls.Events.MANIFEST_PARSED, startVideo);
        } else {
            this.video.src = v.url;
            this.video.onloadedmetadata = startVideo;
        }
    },
    cleanup(){ if(this.hls) this.hls.destroy(); this.video.pause(); this.video.src = ""; this.hls = null; }
};

window.openVideo = async (v) => {
    const exp = localStorage.getItem("user_experience");
    const playerNav = document.getElementById("playerNav");
    const videoElement = document.getElementById("video");
    const customOverlay = document.getElementById("playerCustomControls");

    document.getElementById("seriesModal").style.display = "none";
    document.getElementById("player").style.display = "flex";

    if (exp === 'mobile') {
        playerNav.style.display = "none";
        videoElement.setAttribute("controls", "controls");
        customOverlay.style.display = currentSeries ? "flex" : "none";
    } else {
        playerNav.style.display = "flex";
        videoElement.removeAttribute("controls");
        customOverlay.style.display = "none";
    }

    let finalUrl = v.url;
    if (v.fileKey) {
        const now = Date.now();
        const cache = getSignedCache();
        const cachedItem = cache[v.fileKey];
        if (cachedItem && (now - cachedItem.timestamp < 45 * 60 * 1000)) {
            finalUrl = cachedItem.url;
        } else {
            try {
                const response = await fetch(`${WORKER_URL}?getFile=${v.fileKey}`);
                const data = await response.json();
                if (data.url) {
                    finalUrl = data.url;
                    setSignedCache(v.fileKey, finalUrl);
                }
            } catch (err) { console.error(err); }
        }
    }

    playerController.play({...v, url: finalUrl}); 
    window.switchFocusGroup('player');
};

window.togglePlay = () => {
    const v = document.getElementById("video");
    if (v.paused) v.play(); else v.pause();
};

window.closeVideo = () => {
    playerController.cleanup(); 
    document.getElementById("player").style.display = "none";
    if (currentSeries) { 
        document.getElementById("seriesModal").style.display = "flex"; 
        window.switchFocusGroup('modal'); 
    } else { 
        window.switchFocusGroup('main'); 
    }
    renderContinue(5);
};

window.openSeriesModal = async (v) => {
    currentSeries = v; 
    currentSeason = 0;
    
    document.getElementById("youtubePlayer").innerHTML = "";

    const modal = document.getElementById("seriesModal");
    modal.style.display = "flex";
    document.getElementById("modalScroll").scrollTop = 0;

    document.getElementById("seriesTitle").innerText = v.titulo;
    document.getElementById("tmdbMeta").innerText = "Cargando info...";
    document.getElementById("tmdbOverview").innerText = "";
    document.getElementById("tmdbCredits").innerText = "";
    document.getElementById("seasonSelect").innerHTML = "";
    document.getElementById("episodeList").innerHTML = "";

    const txtUrl = v.img.substring(0, v.img.lastIndexOf('.')) + ".txt";
    let videoId = "";
    try { const r = await fetch(txtUrl); if (r.ok) videoId = (await r.text()).trim(); } catch(e){}
    
    if (videoId) {
        document.getElementById("modalHero").innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${videoId}" frameborder="0" allow="autoplay"></iframe>`;
    } else {
        document.getElementById("modalHero").innerHTML = `<img src="${v.img}" style="width:100%; height:100%; object-fit:cover; opacity:0.3;">`;
    }

    const playBtn = document.getElementById("modalPlayBtn");
    if (v.tipo === "pelicula" || v.tipo === "cine" || v.tipo === "kids") {
        playBtn.style.display = "block";
        playBtn.onclick = () => window.openVideo(v);
    } else {
        playBtn.style.display = "none";
    }

    if (v.tipo === "pelicula" || v.tipo === "cine" || v.tipo === "kids") {
        const query = v.titulo.replace(/^[PS]\./, '').replace(/_/g, ' ');
        try {
            const resp = await fetch(`https://api.themoviedb.org/3/search/movie?query=${encodeURIComponent(query)}&language=es-MX`, {
                headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
            });
            const data = await resp.json();
            if (data.results && data.results.length > 0) {
                const info = data.results[0];
                const year = info.release_date ? info.release_date.split('-')[0] : 'N/A';
                document.getElementById("seriesTitle").innerText = `${info.title} (${year})`;
                document.getElementById("tmdbOverview").innerText = info.overview;
                document.getElementById("tmdbMeta").innerText = `⭐ ${info.vote_average.toFixed(1)} | Estreno: ${info.release_date}`;
                
                const cResp = await fetch(`https://api.themoviedb.org/3/movie/${info.id}/credits?language=es-MX`, {
                    headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
                });
                const cData = await cResp.json();
                const directors = cData.crew.filter(c => c.job === "Director").map(d => d.name).join(", ");
                document.getElementById("tmdbCredits").innerText = directors ? `Director: ${directors}` : "";
            }
        } catch(e) { console.error("Error TMDB:", e); }
    }

    if(v.tipo === "serie" || v.tipo === "anime") {
        v.temporadas.forEach((t, i) => {
            const opt = document.createElement("div"); 
            opt.className = `season-option ${i === currentSeason ? 'active' : ''}`; 
            opt.innerText = t.numero; opt.tabIndex = 0;
            opt.onclick = () => { 
                currentSeason = i; 
                document.querySelectorAll(".season-option").forEach(el => el.classList.remove("active")); 
                opt.classList.add("active"); renderEpisodes(i); 
            };
            document.getElementById("seasonSelect").appendChild(opt);
        });
        renderEpisodes(0);
    }

    window.switchFocusGroup('modal');
};

function renderEpisodes(idx) {
    const list = document.getElementById("episodeList"); list.innerHTML = "";
    currentSeries.temporadas[idx].episodios.forEach((ep, i) => {
        const btn = document.createElement("button"); 
        btn.innerText = ep.titulo; btn.tabIndex = 0;
        btn.onclick = (e) => { e.preventDefault(); currentSeason = idx; currentEpisode = i; window.openVideo(ep); };
        list.appendChild(btn);
    });
    if (localStorage.getItem("user_experience") === 'tv' && window.SpatialNavigation) SpatialNavigation.makeFocusable();
}

window.nextEpisode = () => {
    if (!currentSeries) return;
    const temp = currentSeries.temporadas[currentSeason];
    if (currentEpisode < temp.episodios.length - 1) { 
        currentEpisode++; window.openVideo(temp.episodios[currentEpisode]); 
    } else if (currentSeason < currentSeries.temporadas.length - 1) { 
        currentSeason++; currentEpisode = 0; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    } else window.closeVideo();
};

window.prevEpisode = () => {
    if (!currentSeries) return;
    const temp = currentSeries.temporadas[currentSeason];
    if (currentEpisode > 0) { 
        currentEpisode--; window.openVideo(temp.episodios[currentEpisode]); 
    } else if (currentSeason > 0) { 
        currentSeason--; currentEpisode = currentSeries.temporadas[currentSeason].episodios.length - 1; 
        window.openVideo(currentSeries.temporadas[currentSeason].episodios[currentEpisode]); 
    }
};

window.closeSeriesModal = () => { 
    document.getElementById("seriesModal").style.display = "none"; 
    document.getElementById("modalHero").innerHTML = "";
    currentSeries = null; 
    setupHeroBanner(); 
    window.switchFocusGroup('main'); 
};

let ytPlayer; 
async function setupHeroBanner() {
    const cinePelis = allVideos.filter(v => v.tipo === "cine"); 
    if (cinePelis.length === 0) return;

    const ultimas5 = cinePelis.slice(-5);
    const peliSeleccionada = ultimas5[Math.floor(Math.random() * ultimas5.length)];

    document.getElementById("heroBanner").style.display = "block";
    document.getElementById("heroTitle").innerText = peliSeleccionada.titulo;
    document.getElementById("heroPlayBtn").onclick = () => { currentSeries = null; window.openVideo(peliSeleccionada); };

    const txtUrl = peliSeleccionada.img.substring(0, peliSeleccionada.img.lastIndexOf('.')) + ".txt";
    let videoId = ""; 
    try { 
        const r = await fetch(txtUrl); 
        if (r.ok) videoId = (await r.text()).trim(); 
    } catch (e) {}

    if (!videoId) videoId = "search"; 

    const playerDiv = document.getElementById("youtubePlayer");
    playerDiv.innerHTML = `<div id="yt-frame"></div>`;

    if (!window.YT) {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    window.onYouTubeIframeAPIReady = () => {
        ytPlayer = new YT.Player('yt-frame', {
            height: '100%',
            width: '100%',
            videoId: videoId === "search" ? "" : videoId,
            playerVars: { 
                'autoplay': 1, 'mute': 1, 'controls': 0, 'rel': 0, 'modestbranding': 1 
            },
            events: {
                'onReady': (event) => {
                    if(videoId === "search") {
                        event.target.loadPlaylist({
                            list: peliSeleccionada.titulo + " trailer",
                            listType: 'search'
                        });
                    } else {
                        event.target.playVideo();
                    }
                    
                    const checkInterval = setInterval(() => {
                        if (ytPlayer && ytPlayer.getDuration) {
                            const duration = ytPlayer.getDuration();
                            const currentTime = ytPlayer.getCurrentTime();
                            if (duration > 0 && (duration - currentTime) <= 5) {
                                clearInterval(checkInterval);
                                setupHeroBanner();
                            }
                        }
                    }, 1000);
                },
                'onStateChange': (event) => {
                    if (event.data === YT.PlayerState.ENDED) {
                        setupHeroBanner();
                    }
                }
            }
        });
    };
    
    if (window.YT && window.YT.Player) {
        window.onYouTubeIframeAPIReady();
    }
}

function buildUI(){
    document.getElementById("app").innerHTML = `
        <div class="row"><h2>🆕 Recién agregadas</h2><div class="carousel" id="recentRow"></div></div>
        <div class="row" id="contHeader"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
        <div class="row"><h2>🍿 Cine</h2><div class="carousel" id="cineRow"></div></div>
        <div class="row"><h2>🎬 Películas</h2><div class="carousel" id="peliculasRow"></div></div>
        <div class="row"><h2>🍭 Kids</h2><div class="carousel" id="kidsRow"></div></div>
        <div class="row"><h2>📺 Series</h2><div class="carousel" id="seriesRow"></div></div>
        <div class="row"><h2>🍥 Anime</h2><div class="carousel" id="animeRow"></div></div>`;
    renderAll(); 
    setupHeroBanner(); 
    window.switchFocusGroup('main');
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function processCategoryData(data) {
    const sorted = [...data].reverse(); 
    if (sorted.length <= 15) return sorted;
    
    const first15 = sorted.slice(0, 15);
    const rest = shuffleArray(sorted.slice(15));
    return first15.concat(rest);
}

function renderAll(){
    const sections = [ 
        { id: "recentRow", data: [...allVideos].slice(-30).reverse() }, 
        { id: "cineRow", data: processCategoryData(allVideos.filter(v => v.tipo === "cine")) }, 
        { id: "peliculasRow", data: processCategoryData(allVideos.filter(v => v.tipo === "pelicula")) }, 
        { id: "kidsRow", data: processCategoryData(allVideos.filter(v => v.tipo === "kids")) }, 
        { id: "seriesRow", data: processCategoryData(allVideos.filter(v => v.tipo === "serie")) }, 
        { id: "animeRow", data: processCategoryData(allVideos.filter(v => v.tipo === "anime")) }
    ];

    sections.forEach(section => {
        const container = document.getElementById(section.id); if(!container) return;
        container.innerHTML = ""; loadedCounts[section.id] = 0; loadNextSegment(section.id, section.data);
        const sentinel = document.createElement("div"); sentinel.className = "loading-sentinel"; sentinel.innerText = "•••"; container.appendChild(sentinel);
        new IntersectionObserver((entries) => { if (entries[0].isIntersecting) loadNextSegment(section.id, section.data); }, { root: container, threshold: 0.1 }).observe(sentinel);
    });
    renderContinue(5);
}

function loadNextSegment(containerId, sourceData) {
    const container = document.getElementById(containerId); const sentinel = container.querySelector(".loading-sentinel");
    const start = loadedCounts[containerId] || 0; const segment = sourceData.slice(start, start + SEGMENT_SIZE);
    segment.forEach(v => { const card = createCard(v); sentinel ? container.insertBefore(card, sentinel) : container.appendChild(card); });
    loadedCounts[containerId] = start + segment.length;
    if (loadedCounts[containerId] >= sourceData.length && sentinel) sentinel.style.display = "none";
    if (localStorage.getItem("user_experience") === 'tv' && window.SpatialNavigation) SpatialNavigation.makeFocusable();
}

function createCard(v){
    const card = document.createElement("div"); card.className = "card"; card.tabIndex = 0; card.dataset.title = v.titulo.toLowerCase();
    card.innerHTML = `<img src="${v.img}" loading="lazy">`;
    card.onclick = (e) => { e.preventDefault(); window.openSeriesModal(v); };
    return card;
}

function renderContinue(limite = 5) {
    const data = getProgress(); const row = document.getElementById("continueRow"); const container = document.getElementById("contHeader"); if (!row || !container) return;
    row.innerHTML = "";
    let list = Object.keys(data).map(id => { const base = allVideos.find(v => v.titulo.trim() === id.trim()); return base ? { ...base, _prog: data[id] } : null; }).filter(v => v && v._prog.time > 5 && v._prog.time < v._prog.duration * 0.95);
    list.sort((a, b) => b._prog.updated - a._prog.updated);
    const finalDisplay = list.slice(0, limite); container.style.display = finalDisplay.length === 0 ? "none" : "block";
    finalDisplay.forEach(v => {
        const p = v._prog; const pct = (p.time / p.duration) * 100;
        let info = (v.tipo === "serie" || v.tipo === "anime") ? `T${(p.season || 0) + 1}:E${(p.episode || 0) + 1}` : `Faltan ${Math.ceil((p.duration - p.time)/60)} min`;
        const card = createCard(v); card.innerHTML += `<div class="continue-overlay"><div class="continue-info">${info}</div><div class="continue-line"><div class="continue-progress" style="width:${pct}%"></div></div></div>`;
        row.appendChild(card);
    });
}

document.getElementById("search").addEventListener("input", (e) => {
    const val = e.target.value.toLowerCase().trim();
    if (val.length > 0) {
        document.getElementById("mainCatalog").style.display = "none";
        document.getElementById("heroBanner").style.display = "none";
        document.getElementById("searchResultsContainer").style.display = "block";
        const filtered = allVideos.filter(v => v.titulo.toLowerCase().includes(val)).slice(0, 40);
        const resultsRow = document.getElementById("searchResultsRow");
        resultsRow.innerHTML = "";
        filtered.forEach(v => resultsRow.appendChild(createCard(v)));
    } else { window.resetCatalog(); }
});

window.resetCatalog = () => {
    document.getElementById("search").value = "";
    document.getElementById("mainCatalog").style.display = "block";
    document.getElementById("heroBanner").style.display = "block";
    document.getElementById("searchResultsContainer").style.display = "none";
    window.scrollTo({ top: 0, behavior: 'smooth' });
    window.switchFocusGroup('main');
};

document.getElementById("loginBtn").onclick = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById("loginUser").value, document.getElementById("loginPass").value); } catch(e) { document.getElementById("loginError").style.display = "block"; } };

onAuthStateChanged(auth, async (user) => {
    if(user){
        document.getElementById("loginModal").style.display = "none"; 
        if (!initExperience()) return;
        playerController.init();
        const cacheKey = 'plusultra_catalog_cache'; 
        const cachedData = localStorage.getItem(cacheKey);
        if (cachedData) { allVideos = JSON.parse(cachedData); buildUI(); }
        try { 
            const r = await fetch(WORKER_URL); 
            const data = await r.json(); allVideos = data; 
            localStorage.setItem(cacheKey, JSON.stringify(data)); 
            buildUI(); 
        } catch (e) {}
    } else { document.getElementById("loginModal").style.display = "flex"; }
});

window.logout = () => { localStorage.removeItem("user_experience"); signOut(auth); };

// Manejo del scroll para el header transparente
window.addEventListener('scroll', () => {
    const header = document.querySelector('.header');
    if (window.scrollY > 50) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});
</script>
