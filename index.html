<title>Películas - Página 1</title>

<style>
body { 
  font-family: Arial, sans-serif; 
  background:#0b0f1a; 
  color:#fff; 
  margin:0; 
}

/* HEADER 3D estilo cinepolis */
header { 
  background: linear-gradient(145deg, #002f6c, #0057b8);
  padding:20px; 
  text-align:center; 
  font-size:28px; 
  font-weight:bold;
  letter-spacing:2px;
  text-shadow: 0 3px 10px rgba(0,0,0,0.8);
  box-shadow: inset 0 -3px 10px rgba(255,255,255,0.1),
              0 5px 20px rgba(0,0,0,0.6);
}

/* NAV BOTONES 3D */
.nav { 
  text-align:center; 
  margin:25px; 
}

.nav a { 
  color:#fff; 
  margin:10px; 
  text-decoration:none; 
  padding:12px 20px; 
  border-radius:8px;
  background: linear-gradient(145deg, #0057b8, #003c82);
  box-shadow: 0 5px 15px rgba(0,0,0,0.6),
              inset 0 2px 5px rgba(255,255,255,0.2);
  transition: all 0.3s ease;
  display:inline-block;
}

/* EFECTO BOTON */
.nav a:hover {
  transform: translateY(-3px) scale(1.05);
  background: linear-gradient(145deg, #007bff, #004a99);
}

/* GRID */
.grid { 
  display:grid; 
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); 
  gap:20px; 
  padding:20px; 
}

/* TARJETAS */
.card { 
  background:#111827; 
  border-radius:15px; 
  overflow:hidden;
  text-align:center;
  position:relative;
  box-shadow: 0 10px 25px rgba(0,0,0,0.8);
  transition: all 0.4s ease;
}

/* EFECTO 3D */
.card:hover {
  transform: scale(1.05);
}

/* IMAGEN */
.card img { 
  width:100%; 
  height:300px; 
  object-fit:cover;
  transition: transform 0.4s;
}

.card:hover img {
  transform: scale(1.1);
}

/* TITULO */
.card h3 { 
  margin:10px; 
  font-size:16px;
}

/* SINOPSIS OCULTA */
.card p { 
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:100%;
  background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.2));
  color:#fff;
  font-size:14px;
  padding:15px;
  box-sizing:border-box;
  opacity:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:0.4s;
}

/* MOSTRAR SINOPSIS */
.card:hover p {
  opacity:1;
}
</style>

</head>
