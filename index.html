<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlusUltra</title>
    <style>
        :root { --primary: #0a84ff; --bg: #000; --card-bg: #1c1c1e; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; padding-top: 70px; overflow-x: hidden; }
        
        .header { position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 5%; background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid #333; box-sizing: border-box; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); }
        .logout { padding: 8px 18px; background: #ff3b30; border: none; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }

        .row { margin-bottom: 35px; padding: 0 5%; }
        .row h2 { font-size: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .carousel { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
        
        .card { width: 165px; flex-shrink: 0; aspect-ratio: 2/3; background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; border: 1px solid #333; }
        .card:hover { transform: scale(1.05); border-color: var(--primary); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Título sobre la imagen cuando no hay carátula */
        .card-title { position: absolute; bottom: 0; width: 100%; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); font-size: 12px; text-align: center; box-sizing: border-box; }

        #player { position: fixed; inset: 0; background: #000; display: none; z-index: 9999; }
        video { width: 100%; height: 100%; }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 40px; color: white; cursor: pointer; z-index: 10000; }
        
        #loader { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 5000; }
    </style>
</head>
<body>

<div id="loader">Cargando PlusUltra...</div>

<header class="header">
    <div class="logo">PlusUltra</div>
    <button class="logout" onclick="logout()">Salir</button>
</header>

<main id="app"></main>

<div id="player">
    <span class="close-btn" onclick="closeVideo()">×</span>
    <!-- Añadimos un contenedor para forzar la recarga del elemento video -->
    <div id="video-container" style="width:100%; height:100%;">
        <video id="video" controls playsinline crossorigin="anonymous">
            Tu navegador no soporta video.
        </video>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const WORKER_URL = "https://morning-glade-ac23.rigobertin100.workers.dev";

    // Imagen por defecto elegante si no hay en el R2
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=300&h=450&auto=format&fit=crop";

    async function loadContent() {
        try {
            const res = await fetch(WORKER_URL);
            const data = await res.json();
            renderAll(data);
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            console.error(e);
        }
    }

    function renderAll(videos) {
        const appEl = document.getElementById('app');
        
        // Categorías basadas en tu JSON
        const sections = [
            { title: "🆕 Novedades", items: videos.slice(0, 6) },
            { title: "🎬 Películas y Series", items: videos }
        ];

        appEl.innerHTML = sections.map(sec => `
            <div class="row">
                <h2>${sec.title}</h2>
                <div class="carousel">
                    ${sec.items.map(v => `
                        <div class="card" onclick='openVideo("${v.video}")'>
                            <img src="${v.imagen || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'">
                            <div class="card-title">${v.titulo}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    window.openVideo = (url) => {
        const p = document.getElementById('player');
        const v = document.getElementById('video');
        p.style.display = 'block';
        v.src = url;
        v.play();
    };

    window.closeVideo = () => {
        const p = document.getElementById('player');
        const v = document.getElementById('video');
        v.pause();
        p.style.display = 'none';
    };

    onAuthStateChanged(auth, user => {
        if (user) loadContent();
        else window.location.href = "login.html";
    });

    window.logout = () => signOut(auth);
</script>
</body>
</html>
