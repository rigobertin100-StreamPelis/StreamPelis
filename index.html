<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlusUltra iOS Pro</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:linear-gradient(to bottom,#1c1c1e,#2c2c2e);
color:white;
padding-top:90px;
}

.header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 28px;
z-index:9999;
background:rgba(28,28,30,0.35);
backdrop-filter:blur(25px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:34px;
font-weight:700;
color:#0a84ff;
}

.search{
padding:10px 18px;
border-radius:24px;
border:none;
width:320px;
font-size:16px;
background:rgba(255,255,255,0.1);
color:white;
outline:none;
}

.row{
margin-top:50px;
padding-left:20px;
padding-bottom:10px;
}

.row h2{
font-size:22px;
margin-bottom:14px;
}

.carousel{
display:flex;
gap:18px;
overflow-x:auto;
padding-bottom:18px;
}

.card{
width:260px;
flex-shrink:0;
aspect-ratio:2/3;
position:relative;
border-radius:24px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

.player,
.series-modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
z-index:999999;
background:rgba(0,0,0,.95);
}

.player-inner,
.series-inner{
width:90vw;
height:85vh;
background:#1c1c1e;
border-radius:24px;
overflow:hidden;
position:relative;
padding:20px;
}

video{
width:100%;
height:100%;
border-radius:24px;
}

.close{
position:absolute;
top:14px;
right:24px;
font-size:30px;
cursor:pointer;
z-index:20;
}

#loginModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.96);
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
}

#loginBox{
background:#1c1c1e;
padding:40px;
border-radius:24px;
width:330px;
display:flex;
flex-direction:column;
gap:16px;
}

#loginBox input{
padding:12px;
border:none;
border-radius:14px;
font-size:16px;
}

#loginBox button{
padding:12px;
border:none;
border-radius:14px;
background:#0a84ff;
color:white;
font-weight:bold;
cursor:pointer;
}

#loginError{
display:none;
color:#ff4d4d;
text-align:center;
}

.logout{
background:#ff3b30;
padding:10px 18px;
border:none;
border-radius:18px;
color:white;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginModal">
<div id="loginBox">
<h2>Iniciar Sesión</h2>

<input id="loginUser" type="email" placeholder="Correo">
<input id="loginPass" type="password" placeholder="Contraseña">

<button id="loginBtn">Ingresar</button>

<p id="loginError">Datos incorrectos</p>
</div>
</div>

<!-- HEADER -->
<div class="header">
<div class="logo">PlusUltra</div>

<div style="display:flex; gap:10px; align-items:center;">
<input id="search" class="search" placeholder="Buscar...">
<button class="logout" onclick="logout()">Salir</button>
</div>
</div>

<!-- APP -->
<div id="app"></div>

<!-- PLAYER -->
<div class="player" id="player">
<div class="player-inner">
<span class="close" onclick="closeVideo()">✖</span>
<video id="video" controls controlsList="nodownload"></video>
</div>
</div>

<script type="module">

/* FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* PEGA AQUI TUS DATOS FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
authDomain: "midata-40f73.firebaseapp.com",
projectId: "midata-40f73",
storageBucket: "midata-40f73.firebasestorage.app",
messagingSenderId: "104287406146",
appId: "1:104287406146:web:d9fad446e22629559dc5db"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);

/* VARIABLES */
let allVideos = [];

/* PLAYER */
const video = document.getElementById("video");
let hls = null;

function openVideo(v){

document.getElementById("player").style.display="flex";

if(hls){
hls.destroy();
hls=null;
}

if(v.url.includes(".m3u8") && Hls.isSupported()){

hls = new Hls();
hls.loadSource(v.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
video.play();
});

}else{
video.src = v.url;
video.play();
}
}

window.closeVideo = function(){
video.pause();
video.src="";
document.getElementById("player").style.display="none";
}

/* UI */
function buildUI(){

const app = document.getElementById("app");

app.innerHTML = `
<div class="row">
<h2>🎬 Películas</h2>
<div class="carousel" id="peliculasRow"></div>
</div>

<div class="row">
<h2>📺 Series</h2>
<div class="carousel" id="seriesRow"></div>
</div>

<div class="row">
<h2>🌸 Anime</h2>
<div class="carousel" id="animeRow"></div>
</div>
`;

renderAll();
}

function renderAll(){

renderRow(
allVideos.filter(v=>v.tipo==="pelicula"),
"peliculasRow"
);

renderRow(
allVideos.filter(v=>v.tipo==="serie"),
"seriesRow"
);

renderRow(
allVideos.filter(v=>v.tipo==="anime"),
"animeRow"
);

}

function renderRow(list,id){

const row = document.getElementById(id);
row.innerHTML="";

list.forEach(v=>{

const card = document.createElement("div");
card.className="card";
card.dataset.title=v.titulo.toLowerCase();

card.innerHTML=`
<img src="${v.img}">
`;

card.onclick=()=>openVideo(v);

row.appendChild(card);

});
}

/* SEARCH */
document.getElementById("search").addEventListener("input",(e)=>{

const txt = e.target.value.toLowerCase();

document.querySelectorAll(".card").forEach(c=>{

c.style.display =
c.dataset.title.includes(txt)
? "block"
: "none";

});

});

/* LOGIN */
document.getElementById("loginBtn").onclick = async ()=>{

const email = document.getElementById("loginUser").value.trim();
const pass  = document.getElementById("loginPass").value.trim();

try{

await signInWithEmailAndPassword(auth,email,pass);

}catch(error){

document.getElementById("loginError").style.display="block";

}

};

/* AUTO LOGIN */
onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("loginModal").style.display="none";

fetch("videos.json")
.then(res=>res.json())
.then(data=>{

allVideos=data;
buildUI();

});

}else{

document.getElementById("loginModal").style.display="flex";

}

});

/* LOGOUT */
window.logout = async function(){

await signOut(auth);

}

</script>

</body>
</html>
