<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlusUltra Universal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #000; --panel: #121212; --accent: #0a84ff; --card: #1c1c1e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid #2c2c2e; display: flex; flex-direction: column; padding: 25px; }
        .logo { font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 35px; }
        .search-input { width: 100%; background: #2c2c2e; border: none; border-radius: 12px; padding: 12px; color: white; margin-bottom: 20px; }
        .nav-item { padding: 12px; color: #8e8e93; cursor: pointer; border-radius: 10px; margin-bottom: 5px; }
        .nav-item.active { background: #2c2c2e; color: white; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; }
        .row { margin-bottom: 40px; }
        .carousel { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .card { width: 180px; flex-shrink: 0; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card-inner { aspect-ratio: 2/3; border-radius: 15px; overflow: hidden; background: var(--card); position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { margin-top: 10px; font-size: 14px; text-align: center; color: #eee; }
        .player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; color: white; }
        video { width: 100%; height: 100%; }
        #loader { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="loader">Cargando PlusUltra...</div>

<aside class="sidebar">
    <div class="logo">PlusUltra</div>
    <input type="text" id="searchBox" class="search-input" placeholder="Buscar...">
    <div class="nav-item active">Novedades</div>
    <div class="nav-item">Películas</div>
    <div class="nav-item">Series</div>
    <div class="nav-item">Anime</div>
</aside>

<main class="main-content" id="app"></main>

<div id="player" class="player-overlay">
    <span class="close-btn" onclick="closeVideo()">✕</span>
    <video id="videoElement" controls></video>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1E2XmlsxV52dAwRaXW_e4XdDQxiP8lg",
        authDomain: "midata-40f73.firebaseapp.com",
        projectId: "midata-40f73",
        storageBucket: "midata-40f73.firebasestorage.app",
        appId: "1:104287406146:web:d9fad446e22629559dc5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const workerURL = "https://morning-glade-ac23.rigobertin100.workers.dev";

    function createCard(item) {
        const div = document.createElement('div');
        div.className = 'card';
        
        // CORRECCIÓN CLAVE: Verificamos si la URL ya tiene el worker o si es solo el nombre del archivo
        let finalImg = item.img;
        if (!finalImg.startsWith('http')) {
            finalImg = `${workerURL}?file=${encodeURIComponent(item.img)}`;
        } else if (finalImg.includes('morning-glade') && !finalImg.includes('?file=')) {
            // Si ya es la URL del worker pero no tiene el parámetro, la reconstruimos
            const fileName = finalImg.split('/').pop();
            finalImg = `${workerURL}?file=${encodeURIComponent(fileName)}`;
        }

        div.innerHTML = `
            <div class="card-inner">
                <img src="${finalImg}" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Imagen'">
            </div>
            <div class="card-title">${item.titulo}</div>
        `;

        let finalUrl = item.url;
        if (!finalUrl.startsWith('http')) finalUrl = `${workerURL}?file=${encodeURIComponent(item.url)}`;
        
        div.onclick = () => openVideo(finalUrl);
        return div;
    }

    function render(data) {
        const main = document.getElementById('app');
        main.innerHTML = '';
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<h2>Catálogo</h2><div class="carousel"></div>`;
        const carousel = row.querySelector('.carousel');
        data.forEach(i => carousel.appendChild(createCard(i)));
        main.appendChild(row);
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            fetch(workerURL)
                .then(r => r.json())
                .then(data => {
                    render(data);
                    document.getElementById('loader').style.display = 'none';
                });
        } else {
            window.location.href = 'login.html';
        }
    });

    window.openVideo = (url) => {
        const p = document.getElementById('player');
        const v = document.getElementById('videoElement');
        p.style.display = 'block';
        if(url.includes('.m3u8')) {
            if(Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(v);
                hls.on(Hls.Events.MANIFEST_PARSED, () => v.play());
            }
        } else {
            v.src = url;
            v.play();
        }
    };

    window.closeVideo = () => {
        const v = document.getElementById('videoElement');
        v.pause(); v.src = "";
        document.getElementById('player').style.display = 'none';
    };
</script>
</body>
</html>
