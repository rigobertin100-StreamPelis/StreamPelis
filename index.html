<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MiCuartoSecreto Netflix</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{margin:0;font-family:Arial;background:#050b18;color:white;padding-top:70px;}
.header{position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;padding:12px 20px;z-index:9999;background:rgba(5,11,24,0.35);backdrop-filter:blur(12px);}
.header.scrolled{background:rgba(5,11,24,0.85);box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.logo{font-size:34px;font-weight:800;color:#00b7ff;text-shadow:0 0 15px #008cff;}
.search{position:absolute;right:20px;padding:8px;border-radius:20px;border:none;width:220px;}
.row{margin-top:60px;padding-left:20px;}
.carousel{display:flex;gap:15px;overflow-x:auto;}
.carousel::-webkit-scrollbar{display:none;}
.card{width:250px;flex-shrink:0;aspect-ratio:2/3;position:relative;border-radius:10px;overflow:hidden;cursor:pointer;transition:0.3s;}
.card:hover{transform:scale(1.08);}
.card img{width:100%;height:100%;object-fit:cover;}
.preview-fake{position:absolute;inset:0;opacity:0;background-size:cover;transition:0.3s;}
.card:hover .preview-fake{opacity:1;}
.progress-bar{position:absolute;bottom:0;left:0;height:4px;background:red;}
.player{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:999999;}
.player-inner{width:80vw;height:80vh;background:black;border-radius:12px;overflow:hidden;position:relative;}
video{width:100%;height:100%;}
.close{position:absolute;top:10px;right:15px;font-size:28px;cursor:pointer;z-index:20;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">PlusUltra</div>
  <input id="search" class="search" placeholder="Buscar...">
</div>

<div id="app"></div>

<!-- PLAYER -->
<div class="player" id="player">
  <div class="player-inner">
    <span class="close" onclick="closeVideo()">✖</span>
    <video id="video" controls controlsList="nodownload"></video>
  </div>
</div>

<!-- VIDEOS JS -->
<script src="videos.js"></script>

<script>
let allVideos = videos; // videos viene de videos.js
let currentIndex = 0;
let currentFilter = "";
let autoNext = true;

/* =========================
   HEADER SCROLL
========================= */
window.addEventListener("scroll",()=>{
  const h = document.querySelector(".header");
  if(window.scrollY > 20) h.classList.add("scrolled");
  else h.classList.remove("scrolled");
});

/* =========================
   STORAGE
========================= */
const STORAGE_KEY = "continueWatching";
function getProgress(){return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");}
function saveProgress(id,time,duration){const data=getProgress();data[id]={time,duration,updated:Date.now()};localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}

/* =========================
   PLAYER
========================= */
const playerController = {
  video:null,hls:null,currentId:null,
  init(){
    this.video = document.getElementById("video");
    this.video.addEventListener("timeupdate",()=>{
      if(this.currentId) saveProgress(this.currentId,this.video.currentTime,this.video.duration);
    });
    this.video.addEventListener("ended",()=>{if(autoNext) playNext();});
  },
  play(v){
    this.cleanup();
    this.currentId = v.titulo;
    currentIndex = allVideos.findIndex(x=>x.titulo===v.titulo);
    if(v.url.includes(".m3u8") && Hls.isSupported()){
      this.hls = new Hls();
      this.hls.loadSource(v.url);
      this.hls.attachMedia(this.video);
      this.hls.on(Hls.Events.MANIFEST_PARSED,()=>{this.video.play();});
    } else {
      this.video.src = v.url;
      this.video.onloadedmetadata = ()=>{this.video.play();};
    }
  },
  cleanup(){
    if(this.hls){this.hls.destroy();this.hls=null;}
    this.video.pause();
    this.video.removeAttribute("src");
    this.video.load();
    this.currentId=null;
  }
};

function playNext(){const n=allVideos[currentIndex+1]; if(n) playerController.play(n);}
function closeVideo(){playerController.cleanup(); document.getElementById("player").style.display="none";}
function openVideo(v){document.getElementById("player").style.display="flex"; playerController.play(v);}

/* =========================
   CATEGORÍAS AUTOMÁTICAS
========================= */
const categories = {};
allVideos.forEach(v => {
  if(!categories[v.genero]) categories[v.genero] = [];
  categories[v.genero].push(v);
});

/* =========================
   UI
========================= */
function buildUI(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="row"><h2>🔄 Continuar viendo</h2><div class="carousel" id="continueRow"></div></div>
                   <div class="row"><h2>🆕 Agregadas recientemente</h2><div class="carousel" id="recentRow"></div></div>`;
  
  for(let genero in categories){
    app.innerHTML += `<div class="row"><h2>🎬 ${genero}</h2><div class="carousel" id="${genero}Row"></div></div>`;
  }
  
  renderAll();
}

function renderAll(){
  renderRow(allVideos.slice(-10),"recentRow");
  for(let genero in categories){
    renderRow(categories[genero], genero + "Row");
  }
  renderContinue();
}

function renderContinue(){
  const data = getProgress();
  const list = Object.keys(data)
    .map(t=>allVideos.find(v=>v.titulo===t))
    .filter(Boolean)
    .sort((a,b)=>data[b.titulo].updated-data[a.titulo].updated);
  renderRow(list,"continueRow");
}

function renderRow(list,id){
  const row=document.getElementById(id);
  row.innerHTML="";
  list.forEach(v=>{
    const card=document.createElement("div");
    card.className="card";
    card.dataset.title=v.titulo.toLowerCase();
    card.innerHTML=`<img src="${v.img}"><div class="preview-fake" style="background-image:url(${v.img})"></div>`;
    card.onclick=()=>openVideo(v);
    row.appendChild(card);
  });
  applyFilter();
}

document.getElementById("search").addEventListener("input",(e)=>{currentFilter=e.target.value.toLowerCase().trim(); applyFilter();});
function applyFilter(){document.querySelectorAll(".card").forEach(c=>{c.style.display=c.dataset.title.includes(currentFilter)?"block":"none";});}

/* =========================
   INICIALIZAR
========================= */
playerController.init();
buildUI();
</script>
</body>
</html>
